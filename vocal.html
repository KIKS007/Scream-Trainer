<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vocal Production v0.2</title>
  <!-- PWA: installable + offline (Android home-screen / Scream Trainer). Inert on file://. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f1318">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <script>
    // Register the offline service worker only when served over http(s) — never on file://.
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
  <style>
    :root {
      --bg: #0f1318;
      --panel: #151c24;
      --panel-2: #1c2530;
      --panel-3: #131920;
      --sidebar-bg: #0d1117;
      --text: #e8eef5;
      --muted: #9fb0c3;
      --dim: #4a5c6e;
      --accent: #80d8b3;
      --line: #2a3542;
      --ok: #8de6c0;
      --warn: #f0a46f;
      --bad: #f08b8b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.6;
    }

    /* ── Scrollbars ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--dim); }
    * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

    /* ── App shell ── */
    .app-wrap { display: flex; flex-direction: column; height: 100vh; }
    .app-topbar {
      flex-shrink: 0;
      border-bottom: 1px solid var(--line);
      background: var(--panel-3);
      padding: 12px 20px 0;
    }
    .app-header { margin-bottom: 8px; }
    .app-header h1 { margin: 0 0 3px; font-size: 20px; font-weight: 700; }
    .app-header p  { margin: 0; color: var(--dim); font-size: 12px; }
    .tabs { display: flex; gap: 2px; }
    .tab-button {
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 8px 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.12s;
    }
    .tab-button:hover { color: var(--text); }
    .tab-button[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }

    #app-main { flex: 1; overflow: hidden; position: relative; }

    /* ── Non-layers tabs ── */
    .tab-content {
      height: 100%;
      overflow-y: auto;
      padding: 24px;
      max-width: 860px;
      margin: 0 auto;
    }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
    h1, h2, h3, h4 { margin-top: 0; }
    h2 { font-size: 17px; margin-bottom: 10px; }
    p { margin-top: 0; }
    a { color: #9cd6ff; }
    .learn-summary {
      margin: 8px 0 12px;
      border-left: 3px solid var(--accent);
      background: #11231b;
      border-radius: 6px;
      color: #d9f5e8;
      padding: 9px 11px;
      font-size: 13px;
      line-height: 1.45;
    }
    .learn-meta { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .placeholder { color: var(--muted); font-style: italic; }

    /* ── Layers tab: sidebar + detail ── */
    .layers-shell {
      display: grid;
      grid-template-columns: 220px 1fr;
      height: 100%;
    }

    /* Sidebar */
    .layers-sidebar {
      height: 100%;
      overflow-y: auto;
      border-right: 1px solid var(--line);
      background: var(--sidebar-bg);
      padding: 10px 0 20px;
    }
    .sb-search { padding: 0 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
    .sb-search input {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--text);
      font: inherit;
      font-size: 11px;
      padding: 6px 9px;
      outline: none;
    }
    .sb-search input:focus { border-color: var(--accent); }
    .sb-cat-group { margin-bottom: 2px; }
    .sb-cat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 6px 10px;
      background: transparent;
      border: none;
      color: var(--dim);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .sb-cat-count {
      font-size: 9px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 1px 5px;
      color: var(--dim);
    }
    .sb-cat-links { padding: 0 6px 4px; }
    .sb-section-divider {
      font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--dim);
      padding: 9px 12px 5px; margin-top: 8px;
      border-top: 1px solid var(--line);
    }

    /* Category identity (palette A) */
    .sb-cat-group.cat-accented .sb-cat-header { justify-content: flex-start; gap: 7px; color: var(--cat-c); }
    .sb-cat-icon { display: inline-flex; align-items: center; color: var(--cat-c); flex-shrink: 0; }
    .sb-cat-icon svg { display: block; }
    .sb-cat-group.cat-accented .sb-cat-name { flex: 1; min-width: 0; }
    .sb-cat-group.cat-accented .sb-cat-count {
      margin-left: auto; color: var(--cat-c);
      background: color-mix(in srgb, var(--cat-c) 14%, transparent);
      border-color: transparent;
    }
    .sb-cat-group.cat-accented .sb-cat-links {
      margin-left: 16px; padding-left: 6px;
      border-left: 2px solid color-mix(in srgb, var(--cat-c) 40%, transparent);
    }
    .sb-card-link {
      display: block;
      width: 100%;
      padding: 5px 8px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.1s, color 0.1s;
    }
    .sb-card-link:hover { background: rgba(128,216,179,0.06); color: var(--text); }
    .sb-card-link.active { background: rgba(128,216,179,0.1); color: var(--accent); font-weight: 600; }
    .sb-hidden { display: none; }

    /* Detail panel */
    .layers-detail { height: 100%; overflow-y: auto; padding: 24px 32px 48px; }
    .layers-detail.narrow > * { max-width: 820px; margin-inline: 0; }

    /* MIXING tab */
    .mix-shell { display: grid; grid-template-columns: 280px 1fr; height: 100%; }
    .scr-shell { grid-template-columns: 360px 1fr; }
    .mix-sidebar { height: 100%; overflow-y: auto; border-right: 1px solid var(--line); background: var(--sidebar-bg); padding: 10px 0 20px; }
    .mix-modes { display: flex; gap: 4px; padding: 0 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
    .mix-mode { flex: 1; padding: 6px 4px; font: inherit; font-size: 11px; font-weight: 600; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 5px; cursor: pointer; }
    .mix-mode.active { background: rgba(128,216,179,0.12); color: var(--accent); border-color: rgba(128,216,179,0.4); }
    .mix-doorbody { padding: 0 10px; }
    .mix-search { margin-bottom: 8px; }
    .mix-search input { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; color: var(--text); padding: 6px 8px; font: inherit; font-size: 12px; }
    .mix-hint, .mix-empty { font-size: 11px; color: var(--dim); font-style: italic; padding: 6px 2px; }
    .mix-cardlist { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
    .mix-card-link { display: flex; flex-direction: column; gap: 1px; text-align: left; padding: 7px 9px; border: 1px solid transparent; border-radius: 6px; background: none; cursor: pointer; }
    .mix-card-link:hover { background: rgba(128,216,179,0.06); }
    .mix-card-link.active { background: rgba(128,216,179,0.1); border-color: rgba(128,216,179,0.3); }
    .mix-card-title { font-size: 12.5px; font-weight: 600; color: var(--text); }
    .mix-card-sym { font-size: 11px; color: var(--muted); }
    .mix-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .mix-chip { font: inherit; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; }
    .mix-chip.active { background: rgba(128,216,179,0.14); color: var(--accent); border-color: rgba(128,216,179,0.45); }
    .mix-tree-label { font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); margin: 8px 0 4px; }
    .mix-tree-group { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
    .mix-loc { font: inherit; font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; }
    .mix-loc.active { background: rgba(128,216,179,0.14); color: var(--accent); border-color: rgba(128,216,179,0.45); }
    .mix-loc.empty { opacity: 0.4; }
    .mix-branch-descs { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 4px; }
    .mix-chip-static { font-size: 10px; padding: 2px 7px; border-radius: 999px; background: rgba(143,182,201,0.12); color: #8fb6c9; }
    .chip.mix-chip-tag { background: rgba(143,182,201,0.12); color: #8fb6c9; border-color: rgba(143,182,201,0.3); }
    .chip.mix-loc-tag { background: rgba(240,164,111,0.1); color: var(--warn); border-color: rgba(240,164,111,0.3); }
    .mix-fix { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; background: var(--panel-2); }
    .mix-fix-head { margin-bottom: 6px; }
    .mix-fix-body { margin: 0; }

    /* SCREAM tab */
    .scr-roadmap { display: flex; flex-direction: column; gap: 2px; }
    .scr-phase { margin-bottom: 8px; }
    .scr-phase-session { border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 10px; }
    .scr-ms-tool .scr-ms-num { color: var(--muted); font-weight: 600; }
    .scr-phase-head { display: flex; align-items: center; gap: 6px; font-size: 9px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--dim); margin: 8px 2px 4px; }
    .scr-phase-title { flex: 1 1 auto; min-width: 0; }
    .scr-phase-progress { color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: 0.04em; }
    .scr-phase-num { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%; background: rgba(128,216,179,0.14); color: var(--accent); font-size: 9px; }
    .scr-ms-link { display: grid; grid-template-columns: 22px 1fr auto; align-items: baseline; gap: 7px; width: 100%; text-align: left; padding: 5px 9px; border: 1px solid transparent; border-radius: 6px; background: none; cursor: pointer; }
    .scr-ms-link:hover { background: rgba(128,216,179,0.06); }
    .scr-ms-link.active { background: rgba(128,216,179,0.12); border-color: rgba(128,216,179,0.35); }
    .scr-ms-num { font-size: 10px; font-weight: 700; color: var(--accent); min-width: 22px; }
    .scr-ms-title { font-size: 12px; color: var(--text); }
    .scr-ms-status { justify-self: end; align-self: center; width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-3); }
    .scr-ms-status.unlocked { background: var(--accent); border-color: rgba(128,216,179,0.9); box-shadow: 0 0 0 3px rgba(128,216,179,0.08); }
    .scr-progress-summary { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
    .scr-progress-pill { font-size: 11px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 3px 8px; }
    .scr-unlock-btn { font: inherit; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); cursor: pointer; margin: -2px 0 16px; }
    .scr-unlock-btn:hover { border-color: rgba(128,216,179,0.45); color: var(--text); }
    .scr-unlock-btn.unlocked { color: var(--accent); background: rgba(128,216,179,0.12); border-color: rgba(128,216,179,0.45); }
    .scr-detail-phase { font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
    .scr-current-note { font-size: 11px; color: var(--dim); font-style: italic; margin: -4px 0 14px; }
    .detail-prose { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0; }
    .scr-safety { color: var(--warn); font-size: 13.5px; line-height: 1.55; margin: 0; padding: 9px 12px; border-left: 3px solid var(--warn); background: rgba(240,164,111,0.08); border-radius: 0 5px 5px 0; }
    .scr-safety-banner { margin-bottom: 16px; }
    .scr-next-link { font: inherit; font-size: 13px; font-weight: 600; color: var(--accent); background: rgba(128,216,179,0.1); border: 1px solid rgba(128,216,179,0.3); border-radius: 6px; padding: 5px 11px; cursor: pointer; }
    .scr-next-link:hover { background: rgba(128,216,179,0.18); }
    .scr-check-fields { display: flex; flex-direction: column; gap: 14px; margin: 18px 0; }
    .scr-check-label { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .scr-check-opts { display: flex; flex-wrap: wrap; gap: 6px; }
    .scr-opt { font: inherit; font-size: 12px; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; }
    .scr-opt.active { background: rgba(128,216,179,0.16); color: var(--accent); border-color: rgba(128,216,179,0.5); }
    .scr-guidance { font-size: 14.5px; font-weight: 600; padding: 12px 14px; border-radius: 7px; margin: 6px 0 18px; }
    .scr-guidance-redflag { color: #ff8a8a; background: rgba(229,90,90,0.16); border: 1px solid rgba(229,90,90,0.55); }
    .scr-guidance-rest { color: var(--warn); background: rgba(240,164,111,0.12); border: 1px solid rgba(240,164,111,0.4); }
    .scr-guidance-cleans { color: #d9c97a; background: rgba(217,201,122,0.1); border: 1px solid rgba(217,201,122,0.35); }
    .scr-guidance-open { color: var(--accent); background: rgba(128,216,179,0.12); border: 1px solid rgba(128,216,179,0.4); }
    .scr-guidance-pending { color: var(--dim); background: var(--panel-2); border: 1px solid var(--line); font-weight: 500; }
    .scr-rules li { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-bottom: 5px; }
    .scr-check-note { font-size: 11px; color: var(--dim); font-style: italic; margin-top: 12px; }
    .scr-warmup { margin: 14px 0 0; padding-left: 0; list-style: none; counter-reset: scrw; }
    .scr-warmup li { display: flex; flex-direction: column; gap: 2px; padding: 9px 0; border-bottom: 1px solid var(--line); }
    .scr-warmup-t { font-size: 12.5px; font-weight: 700; color: var(--text); }
    .scr-warmup-d { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .scr-video { position: relative; display: block; width: 100%; padding-top: 56.25%; border-radius: 8px; overflow: hidden; background: #000; border: 1px solid var(--line); text-decoration: none; }
    .scr-video img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .scr-video-play { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 64px; height: 44px; border-radius: 11px; background: rgba(20,20,20,0.72); transition: background 0.15s ease; }
    .scr-video-play::after { content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-35%,-50%); border-style: solid; border-width: 10px 0 10px 17px; border-color: transparent transparent transparent #fff; }
    .scr-video:hover .scr-video-play { background: #cc0000; }
    .scr-video-cap { font-size: 11.5px; color: var(--dim); line-height: 1.5; margin: 7px 0 0; }
    .rec-place { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; }
    .rec-place dt { color: var(--dim); font-size: 12px; font-weight: 600; }
    .rec-place dd { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
    .rec-direction { display: flex; flex-direction: column; gap: 7px; }
    .rec-diagram { --rec-gold:#d9a441; --rec-arrow:#f0705a; --rec-sil:#c2ccd6; --rec-mouth:#1b212a; --rec-pop:#f0a46f; --rec-cyan:#5ec8e0; --rec-accent:#80d8b3; background:#1b212a; border:1px solid var(--line); border-radius:8px; padding:6px; }
    .rec-diagram svg { display:block; width:100%; height:auto; max-width:560px; }
    .rec-diagram-cap { font-size:11.5px; color:var(--dim); line-height:1.5; margin:7px 0 0; }
    .rec-shell { grid-template-columns: 280px minmax(0,1fr) 360px; }
    .rec-diagram-col { height:100%; overflow-y:auto; border-left:1px solid var(--line); background:var(--sidebar-bg); }
    .rec-diagram-col-inner { padding:24px 20px; position:sticky; top:0; }
    .rec-diagram-title { font-size:11px; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; color:var(--accent); margin:0 0 12px; }
    @media (max-width:1100px){ .rec-shell { grid-template-columns: 280px 1fr; } .rec-diagram-col { display:none; } }

    /* Card header */
    .card-title  { font-size: 27px; font-weight: 700; margin: 0 0 10px; }
    .card-meta   { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .card-what   { color: var(--muted); font-size: 16px; line-height: 1.6; margin: 0 0 24px; }

    /* Chips */
    .chip {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      border-radius: 999px;
      padding: 4px 11px;
    }
    .chip-type    { background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
    .chip-category {
      gap: 5px; color: var(--cat-c);
      background: color-mix(in srgb, var(--cat-c) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--cat-c) 35%, transparent);
    }
    .chip-category svg { display: block; }
    .chip-role    { background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
    .chip-intent  { background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
    .chip-synonym { background: #1a2717; border: 1px solid #3d5030; color: #c6e8a8; font-size: 11px; }

    /* Detail sections */
    .detail-section { margin-bottom: 26px; }
    .detail-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text);
      opacity: 0.55;
      margin-bottom: 10px;
    }
    .detail-text { font-size: 15px; color: var(--muted); line-height: 1.55; margin: 0; }
    .detail-list { margin: 0; padding-left: 20px; }
    .detail-list li { font-size: 15px; color: var(--muted); margin: 5px 0; line-height: 1.5; }
    .detail-list li::marker { color: var(--dim); }
    .adapt-list li::marker { color: var(--warn); }

    /* Direction block */
    .direction-block {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-left: 3px solid #3b5f86;
      border-radius: 6px;
      padding: 10px 13px;
      margin-top: 8px;
    }
    .direction-block .dir-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--dim); margin-bottom: 5px;
    }
    .direction-block p { margin: 3px 0; font-size: 13px; color: var(--muted); }

    /* Chain flow */
    .chain-flow { display: flex; flex-direction: column; gap: 4px; }
    .chain-step {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 12px;
    }
    .chain-stage {
      flex-shrink: 0;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-radius: 3px;
      padding: 3px 6px;
      margin-top: 2px;
    }
    .cs-tune   { background: rgba(159,196,181,0.15); border: 1px solid rgba(159,196,181,0.4); color: #9fc4b5; }
    .cs-eq     { background: rgba(143,182,201,0.15); border: 1px solid rgba(143,182,201,0.4); color: #8fb6c9; }
    .cs-deess  { background: rgba(146,180,155,0.15); border: 1px solid rgba(146,180,155,0.4); color: #92b49b; }
    .cs-comp   { background: rgba(215,164,97,0.15);  border: 1px solid rgba(215,164,97,0.4);  color: #d7a461; }
    .cs-sat    { background: rgba(210,121,108,0.15); border: 1px solid rgba(210,121,108,0.4); color: #d2796c; }
    .cs-rev    { background: rgba(183,160,216,0.15); border: 1px solid rgba(183,160,216,0.4); color: #b7a0d8; }
    .cs-delay  { background: rgba(183,160,216,0.12); border: 1px solid rgba(183,160,216,0.3); color: #b7a0d8; }
    .cs-route  { background: rgba(74,92,110,0.2);    border: 1px solid rgba(74,92,110,0.5);   color: var(--muted); }
    .cs-safety { background: rgba(210,121,108,0.15); border: 1px solid rgba(210,121,108,0.4); color: #d2796c; }
    .cs-dyn    { background: rgba(128,216,179,0.1);  border: 1px solid rgba(128,216,179,0.3); color: var(--accent); }
    .cs-other  { background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
    .chain-step-body { flex: 1; min-width: 0; }
    .chain-plugin { font-size: 15px; font-weight: 600; color: #c8d6e8; line-height: 1.3; }
    .chain-values { font-size: 14px; color: var(--muted); line-height: 1.4; }

    /* Modifier accordion */
    .mod-accordion { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .mod-accordion-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 10px 13px;
      background: var(--panel-2);
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: background 0.12s;
    }
    .mod-accordion-btn:hover { background: var(--panel); color: var(--text); }
    .mod-arrow { font-size: 10px; color: var(--dim); display: inline-block; transition: transform 0.15s; }
    .mod-arrow.open { transform: rotate(90deg); }
    .mod-accordion-body { padding: 11px; display: flex; flex-direction: column; gap: 14px; }
    .mod-accordion-body[hidden] { display: none; }

    /* Modifier exploration palette (Option A — grouped by sonic outcome) */
    .modg { }
    .modg-head { display: flex; align-items: baseline; gap: 7px; margin-bottom: 7px; flex-wrap: wrap; }
    .modg-name {
      font-size: 11px; font-weight: 700; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--text);
    }
    .modg-desc { font-size: 11.5px; color: var(--dim); }
    .modt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 7px; }
    .modt-tile {
      display: flex; flex-direction: column;
      background: var(--panel-3); border: 1px solid var(--line);
      border-left-width: 2px;
      border-radius: 6px; padding: 9px 10px;
      cursor: pointer; text-align: left;
      transition: border-color 0.12s;
    }
    .modt-tile:hover { border-color: var(--dim); }
    .modt-tile.mpe-parallel { border-left-color: #b7a0d8; }
    .modt-tile.mpe-serial   { border-left-color: #c7d4e0; }
    .modt-tile.mpe-send     { border-left-color: var(--accent); }
    /* Three-state computed inverse: explicit (solid, recommended) vs default-compatible (dashed, muted). */
    .modt-tile.is-default { opacity: 0.62; border-left-style: dashed; }
    .modt-tile.is-default:hover { opacity: 0.85; }
    .modt-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .modt-name { font-size: 13px; font-weight: 700; color: var(--text); }
    .modt-state {
      font-size: 8px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px;
    }
    .modt-either { font-size: 9px; color: var(--dim); font-style: italic; }
    .modt-why { font-size: 11.5px; color: var(--muted); line-height: 1.35; margin-bottom: 6px; }
    .modt-chips { display: flex; gap: 4px; flex-wrap: wrap; }
    .modt-chip {
      font-size: 9px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      background: var(--panel-2); border: 1px solid var(--line);
      color: var(--muted); border-radius: 3px; padding: 2px 6px;
    }
    .modp-icon { display: inline-flex; align-items: center; flex-shrink: 0; }
    .modp-icon svg { display: block; }
    .modp-icon.mp-parallel { color: #b7a0d8; }
    .modp-icon.mp-serial   { color: #c7d4e0; }
    .modp-icon.mp-send     { color: var(--accent); }

    .modavoid { padding-top: 12px; border-top: 1px dashed var(--line); }
    .modavoid-label {
      font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--dim); margin: 0 0 6px;
    }
    .modavoid-row { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: var(--muted); padding: 2px 0; }
    .modavoid-x { color: var(--bad); font-weight: 700; flex-shrink: 0; }
    .modavoid-name { text-decoration: line-through; }

    /* Why links */
    .why-links { display: flex; flex-wrap: wrap; gap: 6px; }
    .why-link {
      font-size: 13px; color: var(--accent);
      border: 1px solid rgba(128,216,179,0.22); border-radius: 999px;
      padding: 4px 12px; text-decoration: none; cursor: pointer;
    }
    .why-link:hover { background: rgba(128,216,179,0.08); }

    /* Variants */
    .variants-list { margin: 0; padding-left: 18px; }
    .variants-list li { font-size: 14px; color: var(--muted); margin: 3px 0; }

    /* Compat / avoid entries */
    .compat-list { display: flex; flex-direction: column; gap: 4px; }
    .compat-entry {
      font-size: 13px; color: var(--muted);
      padding: 5px 10px; background: var(--panel-2);
      border: 1px solid var(--line); border-radius: 5px;
    }

    /* Placement block */
    .placement-block {
      background: var(--panel-2); border: 1px solid var(--line);
      border-radius: 6px; padding: 9px 12px;
    }
    .placement-block dl { margin: 0; display: flex; flex-direction: column; gap: 3px; }
    .placement-block dt { display: inline; font-size: 12px; font-weight: 700; color: var(--text); }
    .placement-block dd { display: inline; font-size: 13px; color: var(--muted); margin: 0 0 0 5px; }
    .placement-row { font-size: 13px; }

    /* Empty state */
    .empty-detail {
      display: flex; align-items: center; justify-content: center;
      height: 60%; color: var(--dim); font-size: 13px;
    }

    /* ── Three-column structured layer detail (v0.2.5) ── */
    .layer-detail-3col {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(380px, 1.25fr) minmax(280px, 1fr);
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 1280px) {
      .layer-detail-3col { grid-template-columns: minmax(260px, 1fr) minmax(0, 1.4fr); }
      .col-details { grid-column: 1 / -1; }
    }
    @media (max-width: 880px) {
      .layer-detail-3col { grid-template-columns: 1fr; }
    }
    .col-summary, .col-implementation, .col-details { min-width: 0; }
    .col-details-inner {
      position: sticky; top: 0;
      max-height: calc(100vh - 140px);
      overflow-y: auto;
    }
    .details-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px 18px;
    }
    .details-card-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--dim); margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .details-empty {
      background: var(--panel-3);
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 18px 16px;
      color: var(--dim);
      font-size: 13px;
      font-style: italic;
      text-align: center;
    }
    .details-close {
      background: var(--panel-2); border: 1px solid var(--line);
      color: var(--muted); cursor: pointer; padding: 2px 8px;
      border-radius: 4px; font-size: 11px; font-style: normal;
      letter-spacing: 0;
    }
    .details-close:hover { color: var(--text); border-color: var(--accent); }

    /* Plugin card (in Details column) */
    .pc-head {
      border-bottom: 1px solid var(--line);
      padding-bottom: 9px; margin-bottom: 10px;
    }
    .pc-name { font-size: 17px; font-weight: 700; color: var(--text); margin: 0; }
    .pc-vendor { font-size: 12px; color: var(--dim); margin: 1px 0 6px; }
    .pc-roles { display: flex; flex-wrap: wrap; gap: 4px; }
    .pc-role { font-size: 10px; font-weight: 600;
      background: var(--panel-2); border: 1px solid var(--line);
      color: var(--muted); border-radius: 999px; padding: 2px 8px; }
    .pc-section { margin-top: 12px; }
    .pc-section h4 {
      font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--dim); margin: 0 0 5px;
    }
    .pc-section p { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 3px 0; }
    .pc-section ul { margin: 0; padding-left: 16px; }
    .pc-section li { font-size: 13px; color: var(--muted); line-height: 1.45; margin: 3px 0; }
    .pc-controls dt { font-size: 12px; font-weight: 600; color: var(--text); }
    .pc-controls dd { font-size: 12px; color: var(--muted); margin: 0 0 6px 0; }
    .pc-docs { font-size: 12px; margin-top: 6px; }
    .pc-docs a { color: var(--accent); }

    /* Learn-node (nested in Details column) */
    .ln-title { font-size: 16px; font-weight: 700; margin: 0 0 6px; color: var(--text); }
    .ln-summary {
      border-left: 3px solid var(--accent);
      background: #11231b;
      border-radius: 6px;
      color: #d9f5e8;
      padding: 8px 11px;
      font-size: 13px;
      line-height: 1.45;
      margin: 0 0 10px;
    }
    .ln-body { font-size: 13px; color: var(--muted); line-height: 1.55; margin: 0 0 10px; }
    .ln-meta { color: var(--muted); font-size: 11px; margin-top: 6px; }
    .ln-meta strong { color: var(--text); opacity: 0.7; }
    .ln-related a { color: var(--accent); }

    .impl-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px 18px;
    }
    .impl-panel-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--dim); margin-bottom: 8px;
    }
    .impl-section { margin-bottom: 18px; }
    .impl-section:last-child { margin-bottom: 0; }
    .impl-section-title {
      font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text); opacity: 0.7;
      margin: 0 0 8px;
    }
    .impl-scaffold {
      font-size: 12px; color: var(--dim); font-style: italic;
      padding: 8px 10px; border: 1px dashed var(--line); border-radius: 5px;
    }

    /* Signal-flow chips */
    .signal-flow {
      display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
      margin-bottom: 12px;
    }
    .signal-chip {
      font-size: 9px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; border-radius: 3px; padding: 3px 7px;
    }
    .signal-arrow { color: var(--dim); font-size: 11px; margin: 0 1px; }

    /* Routing block — legacy text form (fallback when routing.main is missing) */
    .routing-block {
      font-size: 13px; color: var(--muted);
      background: var(--panel-2); border: 1px solid var(--line);
      border-radius: 6px; padding: 9px 11px; margin-bottom: 12px;
    }
    .routing-topology { font-family: "Consolas", monospace; font-size: 12px; color: var(--text); }
    .routing-sends { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .routing-notes { font-size: 12px; color: var(--dim); margin-top: 4px; font-style: italic; }

    /* Routing block — structured tree form */
    .route-flow {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .rf-main, .rf-branch {
      display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
      line-height: 1.4;
    }
    .rf-branches {
      margin-top: 4px;
      padding-left: 24px;
    }
    .rf-branch {
      position: relative;
      padding: 4px 0;
    }
    .rf-branch::before {
      content: "";
      position: absolute;
      left: -16px;
      top: -8px;
      width: 12px;
      bottom: 50%;
      border-left: 1.5px solid var(--line);
      border-bottom: 1.5px solid var(--line);
      border-bottom-left-radius: 8px;
      pointer-events: none;
    }
    .rf-branch.is-sidechain::before {
      border-left-style: dashed;
      border-bottom-style: dashed;
      border-color: rgba(240,139,139,0.45);
    }
    .rf-node {
      display: inline-flex; align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel-3);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      color: var(--text);
    }
    .rf-node.r-source    { color: #f0a46f; border-color: rgba(240,164,111,0.45); }
    .rf-node.r-bus       { color: var(--accent); border-color: rgba(128,216,179,0.4); }
    .rf-node.r-fx        { color: #8fb6c9; border-color: rgba(143,182,201,0.45); }
    .rf-node.r-parallel  { color: #b7a0d8; border-color: rgba(183,160,216,0.45); }
    .rf-node.r-sidechain { color: var(--bad); border-color: rgba(240,139,139,0.45); }
    .rf-node.r-master    { color: var(--dim); background: transparent; }
    .rf-edge {
      display: inline-flex; align-items: center;
      color: var(--dim);
      cursor: help;
    }
    .rf-edge svg { display: block; }
    .rf-edge.e-insert    { color: #c7d4e0; }
    .rf-edge.e-send      { color: var(--accent); }
    .rf-edge.e-sidechain { color: var(--bad); }
    .rf-edge.e-parallel  { color: #b7a0d8; }
    .rf-edge.e-return    { color: #8fb6c9; }
    .rf-edge.e-to        { color: var(--dim); }
    .route-svg {
      display: block;
      width: 100%;
      max-width: 560px;
      height: auto;
      overflow: visible;
    }
    .route-svg .rf-edge-hit { cursor: pointer; }
    .route-svg .rf-edge-hit:hover { opacity: 0.6; }
    .rf-sidechains {
      margin-top: 6px;
      padding-left: 24px;
    }
    .rf-sc { padding: 4px 0; }
    .rf-sc-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--bad);
      opacity: 0.8;
      margin-right: 2px;
    }
    .rf-notes {
      font-size: 12px; color: var(--dim);
      font-style: italic;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--line);
    }

    /* Diagram A — stereo pan map */
    .panmap {
      background: var(--panel-2); border: 1px solid var(--line);
      border-radius: 6px; padding: 12px 14px; margin-bottom: 12px;
      max-width: 360px;
    }
    .panmap-label {
      font-size: 9px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--dim); margin-bottom: 8px;
    }
    .panmap-svg { display: block; width: 100%; height: auto; overflow: visible; }
    .panmap-ax  { font: 600 8px/1 "Segoe UI", sans-serif; fill: var(--dim); }
    .panmap-lbl { font: 600 9px/1 "Segoe UI", sans-serif; fill: var(--muted); }
    .panmap-vt  { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    .panmap-vt th { font-size: 9px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--dim); text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); }
    .panmap-vt td { padding: 4px 6px; border-bottom: 1px solid rgba(42,53,66,0.5); color: var(--muted); }
    .panmap-vt td.nm { color: var(--text); font-weight: 600; }
    .panmap-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
    .panmap-note { font-size: 11px; color: var(--dim); font-style: italic; margin: 8px 0 0; }
    .eqcurve-svg { display: block; width: 100%; height: auto; overflow: visible; }
    .eqcurve-ax  { font: 600 8px/1 "Segoe UI", sans-serif; fill: var(--dim); }
    .eqcurve-lbl { font: 600 9px/1 "Segoe UI", sans-serif; }

    /* Structured chain step (expandable) */
    .csteps-toolbar { display: flex; justify-content: flex-end; margin-bottom: 6px; }
    .csteps-foldall {
      font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
      text-transform: uppercase;
      background: transparent; border: 1px solid var(--line);
      color: var(--muted); border-radius: 4px;
      padding: 3px 9px; cursor: pointer;
    }
    .csteps-foldall:hover { color: var(--text); border-color: var(--dim); }
    .csteps { display: flex; flex-direction: column; gap: 6px; }
    .cstep {
      background: var(--panel-2); border: 1px solid var(--line);
      border-radius: 6px; overflow: hidden;
    }
    .cstep-head {
      display: grid;
      grid-template-columns: 20px 60px 20px minmax(90px, max-content) minmax(0, 1fr) 14px;
      gap: 12px;
      align-items: center;
      width: 100%; padding: 9px 11px;
      background: transparent; border: none; color: var(--text);
      cursor: pointer; text-align: left;
    }
    .cstep-placement {
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--dim);
    }
    .cstep-placement svg { display: block; }
    .cstep-placement.p-send      { color: var(--accent); }
    .cstep-placement.p-sidechain { color: var(--bad); }
    .cstep-placement.p-parallel  { color: #b7a0d8; }
    .cstep-placement.p-return    { color: #8fb6c9; }
    .cstep-head:hover { background: rgba(128,216,179,0.04); }
    .cstep-num { font-size: 10px; font-weight: 700; color: var(--dim); }
    .cstep-stage {
      font-size: 9px; font-weight: 700; text-align: center;
      letter-spacing: 0.06em; text-transform: uppercase;
      border-radius: 3px; padding: 3px 6px;
    }
    .cstep-plugin {
      font-size: 13px; font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cstep-plugin.cstep-noplugin { color: var(--muted); font-weight: 500; font-style: italic; }
    .cstep-role {
      font-size: 12px; color: var(--muted);
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cstep-arrow { font-size: 10px; color: var(--dim); transition: transform 0.15s; text-align: center; }
    .cstep-arrow.open { transform: rotate(90deg); }

    /* Preset chip rendered inside the step body */
    .cstep-preset {
      display: inline-block; font-size: 11px; font-weight: 600;
      background: var(--panel-3); border: 1px solid var(--line);
      border-radius: 4px; padding: 2px 7px; color: var(--text);
      margin-left: 6px; letter-spacing: 0.02em;
    }
    .cstep-preset::before { content: "preset · "; color: var(--dim); font-weight: 500; }
    .useful-presets {
      display: flex; flex-direction: column; gap: 6px;
      border: 1px solid var(--line); border-radius: 6px;
      background: rgba(255,255,255,0.015); padding: 8px 9px;
    }
    .useful-preset {
      display: grid; grid-template-columns: minmax(110px, max-content) 1fr;
      gap: 8px; align-items: start; font-size: 12.5px;
    }
    .useful-preset-name { color: var(--text); font-weight: 700; }
    .useful-preset-note { color: var(--muted); line-height: 1.35; }

    /* Tone classes — color the plugin label/pill to match the step's stage badge.
       The same plugin (e.g. Pro-Q 3) can take a different tone in a different step. */
    .tone-tune     { color: #9fc4b5; --tone-bg: rgba(159,196,181,0.12); --tone-bd: rgba(159,196,181,0.45); }
    .tone-eq       { color: #8fb6c9; --tone-bg: rgba(143,182,201,0.12); --tone-bd: rgba(143,182,201,0.45); }
    .tone-deess    { color: #92b49b; --tone-bg: rgba(146,180,155,0.12); --tone-bd: rgba(146,180,155,0.45); }
    .tone-comp,
    .tone-peak,
    .tone-level    { color: #d7a461; --tone-bg: rgba(215,164,97,0.12);  --tone-bd: rgba(215,164,97,0.45);  }
    .tone-sat,
    .tone-color,
    .tone-parallel { color: #d2796c; --tone-bg: rgba(210,121,108,0.12); --tone-bd: rgba(210,121,108,0.45); }
    .tone-rev,
    .tone-space,
    .tone-delay    { color: #b7a0d8; --tone-bg: rgba(183,160,216,0.12); --tone-bd: rgba(183,160,216,0.45); }
    .tone-route    { color: #93a4b6; --tone-bg: rgba(74,92,110,0.2);    --tone-bd: rgba(74,92,110,0.5);    }
    .tone-safety   { color: #d2796c; --tone-bg: rgba(210,121,108,0.12); --tone-bd: rgba(210,121,108,0.45); }
    .tone-dyn,
    .tone-ducking  { color: var(--accent); --tone-bg: rgba(128,216,179,0.1); --tone-bd: rgba(128,216,179,0.35); }
    .tone-placement,
    .tone-automation,
    .tone-other    { color: var(--muted); --tone-bg: var(--panel); --tone-bd: var(--line); }
    .cstep-body { padding: 4px 12px 12px 12px; }
    .cstep-body[hidden] { display: none; }
    .cstep-sub {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--dim);
      margin: 9px 0 5px;
    }
    .cstep-defaults {
      display: grid; grid-template-columns: max-content 1fr;

      color: var(--text); opacity: 0.7;
      font-weight: 600;
    }
    .cstep-defaults dd { margin: 0; color: var(--muted); }

      display: block; font-size: 11px; color: var(--dim);
      font-style: italic; margin-top: 1px;
    }
    .cstep-set { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0; }
    .cstep-adapt { margin: 0; padding-left: 16px; font-size: 13px; }

      font-size: 13px; color: var(--muted); margin: 0;
      padding: 7px 9px; border-left: 3px solid var(--warn);
      background: rgba(240,164,111,0.05); border-radius: 0 4px 4px 0;
    }
    .cstep-alts { display: flex; flex-direction: column; gap: 4px; }
    .cstep-alt { font-size: 12px; color: var(--muted); }
    .cstep-alt-name { color: var(--text); font-weight: 600; }

    /* Plugin pill — colors come from the tone-{stage} class applied alongside */
    .plugin-pill {
      display: inline-flex; align-items: center;
      background: var(--tone-bg, rgba(128,216,179,0.08));
      border: 1px solid var(--tone-bd, rgba(128,216,179,0.25));
      border-radius: 999px;
      padding: 1px 10px;
      font: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer;
    }
    .plugin-pill:not(.plugin-pill-static):hover { filter: brightness(1.15); }
    .plugin-pill[aria-expanded="true"] { filter: brightness(1.3); box-shadow: 0 0 0 1px var(--tone-bd, var(--accent)) inset; }
    .plugin-pill-static {
      cursor: default; opacity: 0.7;
      border-style: dashed;
      font-weight: 500;
    }

    /* Source-tooltip superscript */
    .src-sup {
      display: inline-block; cursor: help;
      font-size: 10px; font-weight: 700;
      color: var(--accent);
      background: rgba(128,216,179,0.12);

      border-radius: 999px;

      border-radius: 3px; padding: 0 5px; margin-left: 4px;
      vertical-align: middle;
    }

      color: #8fb6c9; background: rgba(143,182,201,0.1);
      border-color: rgba(143,182,201,0.3);
    }
    .component-link {
      color: var(--accent); text-decoration: none;
      border-bottom: 1px dotted color-mix(in srgb, var(--accent) 50%, transparent);
      cursor: pointer;
    }
    .component-link:hover { border-bottom-style: solid; }

    .al-view { padding: 0; }
    .al-header { margin-bottom: 20px; }
    .al-title { font-size: 22px; font-weight: 700; margin: 0 0 5px; }
    .al-subtitle { font-size: 14px; color: var(--dim); margin: 0 0 16px; }
    .al-filters { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .al-filter-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .al-filter-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--dim); min-width: 64px;
    }
    .al-chip {
      font-size: 12px; font-weight: 600; border-radius: 999px;
      padding: 4px 12px; cursor: pointer; border: 1px solid var(--line);
      background: var(--panel-2); color: var(--muted);
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    .al-chip:hover { border-color: var(--muted); color: var(--text); }
    .al-chip.active { background: rgba(128,216,179,0.1); border-color: rgba(128,216,179,0.35); color: var(--accent); }
    .al-count { font-size: 12px; color: var(--dim); margin-left: auto; flex-shrink: 0; }
    .al-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); column-gap: 12px; row-gap: 8px; }
    .al-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
      display: flex; flex-direction: column; gap: 8px;
      text-align: left;
    }
    /* Align internal rows across all cards for side-by-side comparison */
    @supports (grid-template-rows: subgrid) {

        grid-template-rows: subgrid;
        grid-row: span 5;
        align-content: start;
        align-items: start;

    .al-card-title { font-size: 16px; font-weight: 700; color: var(--text); margin: 0; }

        { learnId: "learn.passaggio.bridge", title: "Passaggio Bridge Stability", in_session: "In a singer's bridge zone, small vowel changes can stabilize resonance and reduce pushing.", body: "Bridge notes vary by voice type, vowel, style, and singer. On close and exposed leads, singer-specific vowel control often preserves tone consistency better than loudness pushing.", synthesis_ref: "Vocal Production Synthesis / passaggio note", related: ["learn.singers-formant.cluster"] },

        { learnId: "learn.routing.types", title: "Routing Types — Insert, Send, Parallel, Sidechain", in_session: "Insert sits in series; send/return and parallel are aux paths blended on a bus; a sidechain key carries no audio, only a trigger.", body: "Insert means the plugin sits in series on the channel — the whole signal passes through it (EQ, de-ess, the channel compressor). A send taps a copy of the signal off to an aux (a reverb or delay), and that processed return is blended back on a bus while the dry signal stays in place on its own path. Parallel duplicates the signal, processes the copy — often harder, e.g. a crushed distortion or a heavy compressor — and blends it under the dry to add density and weight without replacing the dry tone. A sidechain key carries no audio: it is a control trigger from another track (typically the lead) that drives dynamic processing such as ducking a layer's articulation band when the lead sings. In FL Studio a send and a parallel path are built the same way — you route one mixer track to another mixer track and blend the return against the dry. The label is about intent, not mechanism: a 'send' usually feeds a wet time-effect (reverb/delay) you blend in low, while a 'parallel' feeds a driven processor (a hard compressor or distortion) blended under the dry for density. So on the diagram they sit side by side as aux feeds and differ mainly in colour and what the destination does. In the routing diagram, an arrow into a bus that returns from an aux node is a send or parallel return; a dashed line from the lead into a layer is a sidechain key (the Duck). 'Return' names an aux output coming back to a bus, and 'to' is a plain hand-off between nodes on the same path.", synthesis_ref: "Common mixing practice / routing fundamentals", related: ["learn.comp.serial-vs-parallel", "learn.sidechain.ducking"] },

        { learnId: "learn.vocoder-vs-harmoniser", title: "Vocoder vs Harmoniser", in_session: "Vocoder imposes the modulator's spectral envelope on a carrier; harmoniser pitch-shifts to target intervals.", body: "These are separate techniques with different control surfaces and musical outcomes, so they are modeled as separate cards.", synthesis_ref: "Industry practice synthesis and DECISIONS", related: ["learn.formant-shift-principle"] },
        { learnId: "learn.micropitch.eventide", title: "Micropitch Widening", in_session: "Small cents offsets and short delay offsets can create width without full doubles.", body: "Classic harmonizer workflows inspired the micro-detune widening trick used under many modern leads.", synthesis_ref: "Industry-common workflow observations", related: ["learn.vocoder-vs-harmoniser"] },
        { learnId: "learn.telephone-bandpass", title: "Telephone Bandpass Logic", in_session: "Narrow-band filtering shifts perceived source context quickly.", body: "Telephone and AM-style effects rely on focused midrange bandwidth and optional saturation for contrast identity.", synthesis_ref: "Common effect design practice", related: ["learn.spoken-layer-distinction"] },
        { learnId: "learn.convolution-send-principle", title: "Convolution Reverb As Send", in_session: "Large IR spaces are easier to control as automated sends than serial inserts.", body: "Phrase-level send control preserves lead clarity and supports targeted cinematic tails.", synthesis_ref: "Mixing practice + legacy routing notes", related: ["learn.throw-delay-subdivision"] },
        { learnId: "learn.formant-shift-principle", title: "Formant Shift Principle", in_session: "Formant changes alter perceived vocal size and color without moving note pitch.", body: "Independent formant processing can create character contrast on selected phrases while preserving harmonic function.", synthesis_ref: "Voice processing practice", related: ["learn.vocoder-vs-harmoniser"] },
        { learnId: "learn.granular-basics", title: "Granular Vocal Basics", in_session: "Granulation turns sustained source material into evolving texture beds.", body: "Stable source vowels generally produce more controlled results than unstable phrase material in granular engines.", synthesis_ref: "Synthesis and sound-design practice", related: ["learn.vocal-pad-principle"] },
        { learnId: "learn.gang-vocal-method", title: "Gang Vocal Method", in_session: "Group identity comes from collective timing/energy more than pitch-perfect unison.", body: "Multi-person or simulated crowd passes are usually balanced for energy first, with light cleanup and broad glue.", synthesis_ref: "Recording practice references in synthesis", related: ["learn.adlib-layering"] },
        { learnId: "learn.adlib-layering", title: "Ad-Lib Layering", in_session: "Ad-libs read strongest when placed around phrase exits and payoff words.", body: "One-shots and small stacked ad-lib beds serve different roles, so they are split into separate cards.", synthesis_ref: "Arrangement practice references", related: ["learn.throw-delay-subdivision"] },
        { learnId: "learn.vocal-chops-technique", title: "Vocal Chops Technique", in_session: "Chops are rhythmic/textural samples, not lyric-carrying lead replacements.", body: "Slice placement in rhythmic gaps helps maintain lead readability while adding motion and texture.", synthesis_ref: "Common chop workflow practice", related: ["learn.parallel-distortion.principle"] },
        { learnId: "learn.spoken-layer-distinction", title: "Spoken Lead vs Spoken Layers", in_session: "Spoken lead carries cadence focus; spoken layers are texture or accent roles.", body: "Separating Spoken Lead, Spoken Insert, and Spoken-Word Bed avoids role ambiguity and keeps arrangement decisions clearer.", synthesis_ref: "DECISIONS / LAYERS taxonomy refinements", related: ["learn.telephone-bandpass"] },
        { learnId: "learn.shadow-double-house-term", title: "Shadow Double House Term", in_session: "Shadow Double maps to known variants like whisper layer or quiet unison.", body: "The tool retains the house term for continuity while exposing canonical synonyms for discoverability.", synthesis_ref: "DECISIONS / terminology renames", related: ["learn.modifier.concept"] },
        { learnId: "learn.harmony.interval-choice", title: "Harmony Interval Choice", in_session: "3rd, 5th, and 6th intervals shift color and tension differently.", body: "Interval choice can be handled as one-parameter variation when processing and role stay otherwise identical.", synthesis_ref: "Theory practice + LAYERS variants policy", related: ["learn.harmony.reharm-principle"] },
        { learnId: "learn.harmony.reharm-principle", title: "Reharm Stack Principle", in_session: "Supporting voices can imply alternate chord color under unchanged lead melody.", body: "Reharm support stacks can increase harmonic interest while preserving main melodic identity.", synthesis_ref: "Arrangement practice references", related: ["learn.harmony.interval-choice"] },
        { learnId: "learn.counter-melody.gap-principle", title: "Counter-Melody Gap Principle", in_session: "Counter lines are most readable when they enter gaps, not simultaneously on every lead syllable.", body: "Gap-first entry keeps lead lyric focus while adding movement and contrast.", synthesis_ref: "Arrangement and orchestration practice", related: ["learn.adlib-layering"] },
        { learnId: "learn.vocal-stack.depth", title: "Vocal Stack Depth", in_session: "Stack depth variants can stay one-parameter when voicing family and bus treatment remain fixed.", body: "If deeper stacks require a different voicing strategy or bus behavior, model that as a separate structural setup pattern.", synthesis_ref: "DECISIONS / VARIANTS guardrail", related: ["learn.stack-bus-glue"] },
        { learnId: "learn.stack-bus-glue", title: "Stack Bus Glue", in_session: "Stack cohesion usually comes from level hierarchy and small glue, not heavy final compression.", body: "Balance inner/outer layers first, then apply light bus treatment for cohesion.", synthesis_ref: "Common stack-mixing practice", related: ["learn.bus.vocal-glue"] },
        { learnId: "learn.whisper-layer-principle", title: "Whisper Layer Principle", in_session: "Whisper support works as low-level texture and quickly masks lead if too bright or too loud.", body: "Heavy de-ess and darker contour keep whisper layers supportive rather than distracting.", synthesis_ref: "Common layered-vocal practice", related: ["learn.shadow-double-house-term"] },
        { learnId: "learn.texture.unvoiced-breath", title: "Unvoiced Breath Texture", in_session: "Unpitched breath cues are transition texture tools, not constant background noise beds.", body: "Rhythmic placement and lead-entry ducking keep breath layers musical and controlled.", synthesis_ref: "Arrangement texture practice", related: ["learn.whisper-layer-principle"] },
        { learnId: "learn.vocal-pad-principle", title: "Vocal Pad Principle", in_session: "Wordless sustained vowel beds carry harmony and atmosphere without lyric competition.", body: "Pad layers generally need controlled bandwidth and smooth fade behavior to sit behind lead phrasing.", synthesis_ref: "Layered arrangement practice", related: ["learn.granular-basics"] },
        { learnId: "learn.reverse-reverb-print", title: "Reverse Reverb Print Workflow", in_session: "Reverse swells are printed edits aligned to phrase onset, not static insert effects.", body: "Print-and-place workflow gives precise timing control and avoids full-song wash.", synthesis_ref: "Common FX production workflow", related: ["learn.throw-delay-subdivision"] },
        { learnId: "learn.throw-delay-subdivision", title: "Throw Delay Subdivision", in_session: "Throw subdivision choice controls perceived rhythmic punctuation and decay behavior.", body: "1/8, dotted, quarter, and half-note throws create different transition impacts while sharing same base throw concept.", synthesis_ref: "Delay throw practice", related: ["learn.convolution-send-principle"] },

        // v0.3 additions — MIXING diagnostic theory
        { learnId: "learn.eq.resonance-sweep", title: "Finding Resonances By Sweeping", in_session: "A narrow boosted bell swept through a band exposes a resonant ring; cut it where it rings loudest.", body: "Many tonal complaints — boxy 300-600 Hz, nasal/honky 800 Hz-1.2 kHz, harsh upper-mid edges — trace to a narrow resonant build-up rather than a whole-band problem. Boosting a high-Q bell and sweeping it makes the offending frequency jump out, then the same band is cut a few dB to remove the ring without thinning the surrounding tone. Narrow surgical cuts target the resonance; wide cuts that try to fix a resonance usually dull the body instead.", synthesis_ref: "Common mixing practice / resonance control", related: ["learn.singers-formant.cluster"] },
        { learnId: "learn.reverb.predelay-depth", title: "Pre-Delay, Filtering, And Depth", in_session: "Pre-delay separates the dry word from its tail; filtering and ducking the return keep space from clouding the lead.", body: "A washy vocal usually has the reverb arriving too soon, too long, or unfiltered; a dry vocal shares no space with the track at all. Pre-delay (roughly 20-60 ms) gaps the dry transient from the wet bloom so words stay intelligible, while high-passing and low-passing the return stops the tail from masking other elements. Ducking the return under the dry lead lets the tail bloom in the gaps instead of swelling over the voice, and a short slap delay can glue a dry lead to the track with less wash than a long reverb. Depth is built with these time and filter choices, not just wet/dry level.", synthesis_ref: "Common mixing practice / reverb and depth", related: ["learn.routing.types"] },
        { learnId: "learn.tuning.retune-artifacts", title: "Why Fast Tuning Sounds Metallic", in_session: "Robotic warble comes from over-fast retune speed flattening natural pitch movement; slowing it or editing offline restores life.", body: "Real-time tuners snap pitch to a grid; when retune speed is set very fast on an exposed lead, the natural slides and vibrato between notes get flattened into a synthetic warble, and a wrong key/scale forces notes to the nearest grid pitch. Easing retune speed, allowing flex around in-tune notes, and adding humanize on sustained notes keep the movement musical. For a few off notes, offline note-by-note editing usually sounds more natural than pushing a fast real-time engine across the whole line.", synthesis_ref: "Common production practice / pitch tools", related: ["learn.vocoder-vs-harmoniser"] },

        // v0.4 additions — SCREAM mechanism, safety, and warm-up theory
        { learnId: "learn.sovt.principle", title: "SOVT Warm-Up Principle", in_session: "Semi-occluded exercises (straw, lip trills) lower the effort your folds need — before and between loud takes.", body: "Narrowing the vocal tract at the lips or through a straw raises the pressure above the folds, so they vibrate with less collision force (Titze). A few minutes of straw phonation or lip trills warms the voice and resets a tired one between takes. This is established voice science, not folk wisdom.", synthesis_ref: "Vocal Production Synthesis 6.2 / 5.3 (Titze SOVT)", related: ["learn.scream.safety-physiology"] },
        { learnId: "learn.scream.fry-mechanism", title: "Fry Scream Mechanism", in_session: "Fry scream layers an M0 vocal-fry pulse on the true folds with partial false-fold engagement — a cutting, tearing-paper rasp.", body: "The M0 pulse (clean vocal fry) is itself low-pressure and low-impact; the scream borrows that pulse and stacks false-fold engagement and compression on top. Fry carries higher injury risk than false-cord, so it rides on solid support and short practice doses.", synthesis_ref: "Vocal Production Synthesis 2.7, 4.1", related: ["learn.distortion-vs-creak"] },
        { learnId: "learn.scream.false-chord-mechanism", title: "False-Cord Scream Mechanism", in_session: "False-cord screaming carries the growl on false-fold and aryepiglottic activity while modal true-fold effort stays low — a lower, thicker growl.", body: "The true folds may be retracted or producing a quiet pitch underneath while the false folds and aryepiglottic narrowing carry the distortion. Coaches treat false-cord as the gentler first entry; it runs on slow, supported airflow placed high and forward, not a hard throat blast.", synthesis_ref: "Vocal Production Synthesis 4.2", related: ["learn.scream.fry-mechanism"] },
        { learnId: "learn.scream.layered-support", title: "Layered / Supported Scream", in_session: "The mature studio sound is a clean sung pitch underneath with distortion riding on top — the clean note stays clearly audible while grit sits as a thin overlay.", body: "Distortion masks but does not remove the sung pitch; the note stays present while a thin layer of aryepiglottic noise rides over it. Dialing twang and abdominal pressure together moves it from light grit to full scream and back on intent.", synthesis_ref: "Vocal Production Synthesis 4.3", related: ["learn.distortion-vs-creak"] },
        { learnId: "learn.distortion-vs-creak", title: "Distortion Adds, Creak Subtracts", in_session: "Distortion adds grit on top of a note (it sounds bigger); the creak replaces part of the note (it sounds thinner). Forcing the creak is the injury path — go easier.", body: "This mental model keeps fry practice safe: chasing the creak by pushing, constricting, or getting louder is the common injury path. The creak appears by under-energizing — phonating as if slightly too tired for the note — not by forcing it.", synthesis_ref: "Synthesis 4 + scream-coach consensus (Sing and Scream / Vendera)", related: ["learn.scream.fry-mechanism"] },
        { learnId: "learn.load-management.two-day", title: "Scream Load Management", in_session: "Microtrauma swelling peaks 24-48h after heavy load, so keep scream-heavy days short and avoid stacking them back-to-back.", body: "Load is duration times intensity times pitch times tissue condition, not just clock time. A heavy day is followed by a lighter or silent one. The warning trinity — morning hoarseness past breakfast, lost top range, fatigue after short phrases — means back off. Well-produced screams are not inherently more damaging than other singing; technique and overuse are the risk, not the sound itself (Titze).", synthesis_ref: "Vocal Production Synthesis 6.3, 4.4", related: ["learn.scream.safety-physiology"] },
        { learnId: "learn.scream.mic-technique", title: "Mic Technique For Screams", in_session: "Let monitoring, gain, distance, and compression create size, so you do not add throat load just to hear the effect.", body: "Screams clip easily and tempt over-singing when the take sounds small in the room. Setting headphone level, preamp gain, mic distance, and a safety limiter so a projected (not full-out) scream records large keeps body effort stable and protects the voice. The Scream Bus glue and limiter live in the LAYERS chain.", synthesis_ref: "Recording practice + Vocal Production Synthesis 4.4 (load)", related: ["learn.scream.routing"] },

        // v0.6 additions — RECORD capture principles
        { learnId: "learn.capture.proximity-effect", title: "Proximity Effect", in_session: "Moving closer to a directional mic lifts the low end; backing off trades warmth for an even tone.", body: "Cardioid and other directional mics boost low frequencies as the source gets close — the proximity effect. Singing nearer adds body and intimacy but also stronger plosives and level swings; backing off evens the tone and the dynamics. Distance is the first tone control, before any EQ.", synthesis_ref: "Recording practice / microphone theory", related: ["learn.capture.polar-patterns"] },
        { learnId: "learn.capture.polar-patterns", title: "Polar Patterns & Off-Axis", in_session: "Cardioid rejects the room behind the mic; omni captures more space. A slight off-axis angle tames sibilance and plosives.", body: "A cardioid pattern is most sensitive on-axis and rejects sound from the rear, which helps in untreated rooms; omni captures more room and avoids proximity buildup. Aiming slightly off-axis — above or to the side of the mouth — reduces direct plosive blasts and harsh sibilance while keeping the core tone.", synthesis_ref: "Recording practice / microphone theory", related: ["learn.capture.proximity-effect", "learn.capture.plosive-control"] },
        { learnId: "learn.capture.gain-staging-headroom", title: "Gain Staging & Headroom", in_session: "Set input gain so loud peaks land well below clipping; capture is about clean headroom, not loudness.", body: "Preamp gain sets how hot the signal hits the converter. Loud phrases and consonant transients peak far above the average, so leaving generous headroom — peaks comfortably short of full scale — avoids clipping that no plugin can undo. Recording level is not a loudness target; that is set later in the mix.", synthesis_ref: "Recording practice / gain staging", related: ["learn.capture.cue-mix-effort"] },
        { learnId: "learn.capture.plosive-control", title: "Plosive & Pop Control", in_session: "P and B bursts hit the capsule as a low thump; a pop filter plus a slight off-axis angle catches most of it.", body: "Plosives ('p', 'b', 't') send a blast of air the capsule reads as a low-frequency thump. A pop filter a few centimetres off the grille, combined with singing slightly across rather than straight into the mic, intercepts the airflow while leaving the tone intact — easier to prevent than to repair with EQ.", synthesis_ref: "Recording practice / plosive management", related: ["learn.capture.polar-patterns"] },
        { learnId: "learn.capture.cue-mix-effort", title: "Cue Mix & Vocal Effort", in_session: "The headphone balance steers how hard a singer pushes — a buried vocal invites oversinging; a loud one invites pulling back.", body: "The monitor mix a singer hears shapes their physical effort. If the vocal sits too low against the track, the natural response is to push harder and strain; too loud, and intonation and energy sag. A balanced, comfortable cue level lets the take's intensity come from intent rather than from fighting the mix.", synthesis_ref: "Recording practice / monitoring", related: ["learn.scream.mic-technique"] },
        { learnId: "learn.capture.group-vocal", title: "Group / Gang Vocal Capture", in_session: "Size comes from multiple passes and positions, not one loud take — stack performances and vary placement for spread.", body: "A convincing group or gang vocal is built from several performances captured at varied distances and stereo positions, not a single shouted pass. Doubling the same line with small changes in placement and singers widens and thickens it; one over-pushed take just sounds strained and narrow.", synthesis_ref: "Recording practice / group-vocal tradition", related: ["learn.capture.cue-mix-effort", "learn.scream.mic-technique"] }
      ];

            { id: "fcord.toggle", num: "2.5", title: "Rasp on/off — back to clean", focus: "Treat the rasp like a switch: bring it in, then drop back to a clean unstrained voice on command. Proving you can exit is the control (and safety) check.", drill: "On an easy sigh, fade the raspy texture in, then release back to a clean breathy sigh; repeat, keeping the throat loose each time. Afterwards, check your clean speaking voice is unchanged.", success: "You can turn the rasp on and off at will and land back on a clean tone, with no leftover scratch in your speaking voice.", safety: "If you cannot return to a clean voice easily, you are over-engaging — stop and rest.", why: ["learn.scream.false-chord-mechanism"], video: { id: "1F-PjS9HHDg", title: "Ramsey Voice Studio — clean-to-distorted rasp control" } },
            { id: "fcord.shape", num: "2.6", title: "Shape the tone", focus: "Use the mouth and tongue to colour the growl from low and dark to tighter and more guttural.", drill: "A rounded lowercase-'o' mouth for a low dark growl; tongue forward behind the teeth for a tighter edge; explore gentle jaw movement.", success: "You can move deliberately between a fuller low growl and a brighter, tighter rasp.", why: [] },
            { id: "fcord.sustain", num: "2.7", title: "Open throat + sustain a steady tone", focus: "A full, rich false-cord tone held steady on one breath.", drill: "Notice the open-throat feeling of a yawn, apply it while growling, and hold a steady rasp for the length of a comfortable breath; reset between attempts.", success: "A full false-cord tone that stays even for a breath, with the clean tone returning immediately after.", safety: "If it ever hurts, stop and return later.", why: ["learn.scream.false-chord-mechanism"] },
            { id: "fcord.phrase", num: "2.8", title: "Carry it through words", focus: "Take the steady tone into actual words and a short phrase.", drill: "Apply the false-cord tone across a short lyric or phrase, keeping the texture even from word to word.", success: "A full false-cord scream that lasts a phrase, the clean tone returns immediately after, and your speaking voice is unchanged.", why: ["learn.scream.no-tune"] }

          intro: "The studio-mature sound: a clean sung pitch underneath with distortion riding on top, dialable from light grit to full scream. Met here before the fry climb — it is the gentlest distortion, learned directly on top of your clean foundation.",
          milestones: [
            { id: "layer.base", num: "3.1", title: "Clean supported sung pitch", focus: "The clean note comes first — distortion sits on healthy phonation.", drill: "Sing the target pitch cleanly with full support and a forward, heady placement.", success: "A stable, repeatable clean note with a consistent onset.", why: ["learn.scream.layered-support"] },
            { id: "layer.twang", num: "3.2", title: "Twang", focus: "Brighten the clean note to prep the folds for grit.", drill: "Add twang (bright, narrow, 'ng' or duck-call quality) on the held note.", success: "The tone brightens while the pitch stays intact.", why: ["learn.scream.layered-support"] },

            { id: "layer.dial", num: "3.4", title: "Dial the amount", focus: "Graded control from clean to full.", drill: "Combine more twang plus more abdominal pressure to escalate; ride a slow crescendo clean to light grit to fuller and back down.", success: "A smooth ramp in both directions; intensity tracks support, not throat squeeze.", why: ["learn.scream.layered-support"] },

            { id: "layer.toggle", num: "3.6", title: "Toggle clean to distorted on intent", focus: "Switching mid-phrase for expression.", drill: "Alternate clean and distorted phrases by adding and removing twang plus abdominal engagement.", success: "You drop in and out of distortion on demand without resetting or losing the line.", why: ["learn.scream.layered-support"], video: { id: "79pO4MVcS0I", title: "VoiceHacks — switching clean and harsh vocals mid-song" } }

        {
          id: "fry", num: 4, title: "Fry scream — the long climb",
          intro: "The cutting, tearing-paper rasp. The most rewarding and highest-risk climb — built from three stacked components: distortion, compression, and creak.",
          milestones: [
            { id: "fry.rasp", num: "4.1", title: "Activate the rasp — louder, not higher", focus: "Tip a bright twangy note into a grainy distortion layer over the same pitch.", drill: "On a held note, keep the twang and add intensity and volume (not pitch) until a raspy buzz layers over the note. Vendera's version: glide a clean 'yay' into a raspy 'yaaay'.", success: "A raspy layer rides over the pitch — the clean note stays clearly audible underneath, with grit as a thin overlay.", safety: "If the note cracks underneath, you have pushed past it — ease off.", why: ["learn.distortion-vs-creak"], video: { id: "s4cFbJVszIo", title: "Sibila Extreme Vocal — fry scream, step by step" } },
            { id: "fry.toggle", num: "4.2", title: "Rasp on/off over a sustained note", focus: "Treat distortion like a pedal you switch on and off without moving the pitch.", drill: "Hold one note; add grit, remove grit, repeat. Find a song that sits on that note and practise there.", success: "You can add and remove the rasp at will on a note or two, with the pitch unwavering.", safety: "Your speaking voice is unaffected afterward — no hoarseness or thinning.", why: ["learn.distortion-vs-creak"] },
            { id: "fry.compress", num: "4.3", title: "Introduce light compression", focus: "A gentle closure sensation at low volume that thickens a thin rasp toward a true fry quality — never a throat squeeze.", drill: "At low volume, find a light closed-throat feeling (like the moment just before a cough) and let the rasp speak through it. Keep it gentle; support lives in the belly, not the neck.", success: "A light compression appears with the shoulders down and minimal volume, and no throat tension.", safety: "HARD STOP: pressure building in your head, wheezing, whistling, pain, or any change to your speaking voice means ease off or stop. Compression here is gentle, never a forced squeeze.", why: ["learn.scream.fry-mechanism"], video: { id: "AJAbKuipkoA", title: "Sibila Extreme Vocal — compression & fry scream (no vocal fry)" } },
            { id: "fry.compress-pitch", num: "4.4", title: "Compression without pitch drift", focus: "Dial the gentle compression up and down while the note stays put.", drill: "Hold a note; vary the light compression without letting the pitch move. Keep the throat loose throughout.", success: "Seamless add and remove of light compression, pitch stable, with no worn-out feeling after.", safety: "Keep it gentle — head pressure, wheezing, whistling, pain, or a changed speaking voice means stop.", why: ["learn.scream.fry-mechanism"] },
            { id: "fry.stack", num: "4.5", title: "Compression + distortion together", focus: "Stack the light compression onto the rasp — the first thing that reads as a real fry scream.", drill: "Apply the gentle compression to your raspy note, using only the volume you need.", success: "The distortion sounds wetter and more fry-like; no squeak or whistle, no fatigue.", safety: "Stop on head pressure, wheezing, whistling, pain, or any speaking-voice change.", why: ["learn.scream.fry-mechanism"] },
            { id: "fry.creak-model", num: "4.6", title: "The creak — subtraction, not addition", focus: "A mental model that keeps you safe: distortion adds to the note; the creak replaces part of it, making the tone thinner.", drill: "On one note, compare a grainy distortion (bigger) against a thin creak (weaker, thinner). Just listen and feel the difference.", success: "You can hear that the creak thins the tone where distortion fattens it.", why: ["learn.distortion-vs-creak"], video: { id: "EFHjusQpcEg", title: "Chris Liepe — fry screams: valuable perspective (distortion vs fry register)" } },
            { id: "fry.creak-trigger", num: "4.7", title: "Trigger the creak by under-energizing", focus: "Let the folds slip into the creak by doing less, not more.", drill: "Phonate a note as if a touch too tired for it, or drop the volume about 10 percent, or jump up a note without getting louder — and let it slip into a creak.", success: "A creak appears and it feels easier, not harder.", safety: "The universal rule: forcing, constricting, or getting louder is the common injury path. Go easier; it is the opposite of what you expect.", why: ["learn.distortion-vs-creak"] },
            { id: "fry.reversible", num: "4.8", title: "Clean to creak and back", focus: "Prove control and protect your clean coordination by entering and exiting the creak cleanly.", drill: "Clean note, then creak, then clean, repeatedly. Keep practising falsetto and clean high notes alongside.", success: "You can step in and out of the creak repeatedly and land back on a clean tone.", safety: "If you cannot get back to clean easily, you are over-engaging — rest.", why: ["learn.distortion-vs-creak"] },
            { id: "fry.assemble", num: "4.9", title: "Assemble all three", focus: "Combine distortion, compression, and creak into the refined fry scream.", drill: "Build the three in whatever order your voice prefers (it is modular, not linear). Vendera's 'E-scream': wide smile, soft falsetto 'eeee', then swell the volume until it distorts.", success: "A repeatable fry scream — Vendera's tactile flutter on the roof of the mouth signals it is engaging well, the clean tone returns immediately after, and your speaking voice is unchanged.", safety: "If it hurts, or if you lose the flutter, stop and rest — that signals overworking or wrong coordination.", why: ["learn.scream.fry-mechanism"], video: { id: "6eUV205aQic", title: "Sibila Extreme Vocal — fry scream in three balanced steps" } }

      function detectChainStage(text) {
        const t = text.toLowerCase();
        if (/^route[:\s]/i.test(text)) return "route";
        if (/safety\s*limit|ceiling|limiter/i.test(t)) return "safety";
        if (/^tune[:\s]|melodyne|retune[:\s]|pitch correct|offline correct/i.test(t)) return "tune";
        if (/^pro-q|^fab-filter|hpf|lpf|^eq[:\s]|equaliz|shelv|high.pass|low.pass/i.test(t)) return "eq";
        if (/de-?ess|pro-ds|sibilanc/i.test(t)) return "deess";
        if (/dynamic\s*eq|dyn\s*eq/i.test(t)) return "dyn";
        if (/1176|cla-2a|la-2a|pro-c|pro-mb|compress|leveling|gain reduction|glue comp|bus comp/i.test(t)) return "comp";
        if (/decapitator|saturat|distort|overdrive|tape|tube|drive|color|warm|bitcrush/i.test(t)) return "sat";
        if (/echoboy|slap send|delay|throw/i.test(t)) return "delay";
        if (/pro-r|reverb|convol|send.*reverb|reverb.*send|plate|room/i.test(t)) return "rev";
        return "other";
      }

      function parseChainItem(text) {
        const colonMatch = text.match(/^([A-Za-z0-9 \-\.]{2,28}):\s*(.+)$/);
        if (colonMatch) return { plugin: colonMatch[1].trim(), values: colonMatch[2].trim() };
        const knownPlugins = ["Melodyne", "Pro-Q 3", "Pro-Q", "Pro-DS", "Pro-C 2", "Pro-C", "Pro-R", "CLA-2A", "LA-2A", "1176", "Decapitator", "EchoBoy", "Little AlterBoy"];
        for (const p of knownPlugins) {
          if (text.startsWith(p)) return { plugin: p, values: text.slice(p.length).replace(/^[\s,at]+/, "") };
        }
        return { plugin: null, values: text };
      }

      function renderChainFlow(items) {
        if (!items || !items.length) return "<p class=\"detail-text\">No chain defined.</p>";
        return "<div class=\"chain-flow\">" + items.map(function(text) {
          const stage = detectChainStage(text);
          const meta = STAGE_META[stage] || STAGE_META.other;
          const parsed = parseChainItem(text);
          const plugin = parsed.plugin ? "<div class=\"chain-plugin\">" + escapeHtml(parsed.plugin) + "</div>" : "";
          const vals = "<div class=\"chain-values\">" + escapeHtml(parsed.values) + "</div>";
          return "<div class=\"chain-step\"><span class=\"chain-stage " + meta.cls + "\">" + meta.label + "</span><div class=\"chain-step-body\">" + plugin + vals + "</div></div>";
        }).join("") + "</div>";
      }

        "Accents":     { color: "#e8c63f", icon: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M13 2.5 L6 13 H11 L10.5 21.5 L18 11 H13 Z"/></svg>' },
