        "Modifiers":   { color: "#34bcd0", icon: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 8 H21"/><circle cx="8.5" cy="8" r="2.5" fill="#0f1318"/><path d="M3 16 H21"/><circle cx="15" cy="16" r="2.5" fill="#0f1318"/></svg>' },
        "Buses":       { color: "#95a3b3", icon: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5 H9 a7 7 0 0 1 7 7"/><path d="M3 12 H16"/><path d="M3 19 H9 a7 7 0 0 0 7 -7"/><path d="M16 12 H21"/><path d="M18 9 L21 12 L18 15"/></svg>' },
        "Composite":   { color: "#e8736b", icon: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.6"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.6"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.6"/><rect x="13" y="13" width="7.5" height="7.5" rx="1.6"/></svg>' }
      };
      function categoryMeta(name) { return CATEGORY_META[name] || { color: "var(--dim)", icon: "" }; }

      function renderLayersSidebarInner() {
        const q = state.sbQuery.toLowerCase();
        const order = ["Lead", "Thickeners", "Harmony", "Texture", "Accents", "Creative FX", "Modifiers", "Buses", "Composite"];
        const grouped = {};
        for (const k of order) grouped[k] = [];
        for (const card of LAYERS_CARDS) {
          const cat = COMPOSITE_SUBTYPES.has(card.subtype) ? "Composite" : (card.layerCategory || "Other");
          if (grouped[cat]) grouped[cat].push(card);
        }
        const allActive = state.selectedCardId === "all-layers";
        let html = "<div class=\"sb-search\"><input type=\"search\" placeholder=\"Search…\" id=\"sb-search-input\" value=\"" + escapeHtml(state.sbQuery) + "\" autocomplete=\"off\"></div>";
        html += "<div class=\"sb-cat-group\" style=\"padding:0 6px 8px;border-bottom:1px solid var(--line);margin-bottom:6px\">";
        html += "<button type=\"button\" class=\"sb-card-link" + (allActive ? " active" : "") + "\" data-select-card=\"all-layers\" style=\"font-weight:600;padding:7px 8px\">⊞ All Layers</button>";
        html += "</div>";
        const SUPPORTING_CATS = { "Modifiers": 1, "Buses": 1, "Composite": 1 };
        let dividerEmitted = false;
        for (const cat of order) {
          const cards = grouped[cat] || [];
          const visible = q ? cards.filter(function(c) { return c.title.toLowerCase().includes(q); }) : cards;
          if (!visible.length) continue;
          if (SUPPORTING_CATS[cat] && !dividerEmitted) {
            html += "<div class=\"sb-section-divider\">Treatments &amp; patterns</div>";
            dividerEmitted = true;
          }
          const cm = categoryMeta(cat);
          html += "<div class=\"sb-cat-group cat-accented\" style=\"--cat-c:" + cm.color + "\">";
          html += "<div class=\"sb-cat-header\"><span class=\"sb-cat-icon\">" + cm.icon + "</span><span class=\"sb-cat-name\">" + escapeHtml(cat) + "</span><span class=\"sb-cat-count\">" + visible.length + "</span></div>";
          html += "<div class=\"sb-cat-links\">";
          for (const card of visible) {
            const active = card.id === state.selectedCardId;
            html += "<button type=\"button\" class=\"sb-card-link" + (active ? " active" : "") + "\" data-select-card=\"" + escapeHtml(card.id) + "\">" + escapeHtml(renderSbCardTitle(card)) + "</button>";
          }
          html += "</div></div>";
        }
        return html;
      }

      function renderLayersSidebar() {
        return "<aside class=\"layers-sidebar\" id=\"layers-sidebar\">" + renderLayersSidebarInner() + "</aside>";
      }

      const learnBuild = buildLearnIndex(LEARN_NODES);
      const LEARN_INDEX = learnBuild.index;
      const CARD_INDEX = buildCardIndex(LAYERS_CARDS);

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function buildLearnIndex(nodes) {
        const index = Object.create(null);
        const collisions = [];
        for (const node of nodes) {
          if (Object.prototype.hasOwnProperty.call(index, node.learnId)) collisions.push(node.learnId);
          else index[node.learnId] = node;
        }
        return { index, collisions };
      }

      function buildCardIndex(cards) {
        const index = Object.create(null);
        for (const card of cards) index[card.id] = card;
        return index;
      }

      function parseHash(hash) {
        const raw = String(hash || "");
        const learnMatch = raw.match(/^#learn:(.+)$/);
        if (learnMatch) return { tab: "learn", learnId: decodeURIComponent(learnMatch[1]), cardId: null };
        const cardMatch = raw.match(/^#card:(.+)$/);
        if (cardMatch) return { tab: "layers", learnId: null, cardId: decodeURIComponent(cardMatch[1]) };
        const recordMatch = raw.match(/^#record:(.+)$/);
        if (recordMatch) return { tab: "record", learnId: null, cardId: null, recordId: decodeURIComponent(recordMatch[1]) };
        const tabMatch = raw.match(/^#tab:([a-z]+)$/);
        if (tabMatch && TAB_IDS.has(tabMatch[1])) return { tab: tabMatch[1], learnId: null, cardId: null };
        return { tab: "layers", learnId: null, cardId: null };
      }

      function tabHash(tabId) { return "#tab:" + tabId; }
      function learnHash(learnId) { return "#learn:" + encodeURIComponent(learnId); }
      function cardHash(cardId) { return "#card:" + encodeURIComponent(cardId); }
      function recordHash(cardId) { return "#record:" + encodeURIComponent(cardId); }

      function selectCard(id) {
        if (id !== "all-layers" && !CARD_INDEX[id]) return;
        state.selectedCardId = id;
        // Note: do NOT reset details panel — each layer remembers what was last pinned.

        // Update only the detail panel — preserves sidebar scroll position
        const detail = document.querySelector(".layers-detail");
        if (detail) {
          const isAllLayers = id === "all-layers";
          const targetCard = isAllLayers ? null : CARD_INDEX[id];
          const useNew = !!(targetCard && Array.isArray(targetCard.implementationSections) && targetCard.implementationSections.length);
          detail.classList.toggle("narrow", !isAllLayers && !useNew);
          detail.innerHTML = isAllLayers ? renderAllLayersView() : renderCardDetail(targetCard);
          detail.scrollTop = 0;
          applyInlineLearnTooltips();
        }

        // Swap active class in sidebar without re-rendering it
        const sidebar = document.getElementById("layers-sidebar");
        if (sidebar) {
          const prev = sidebar.querySelector(".sb-card-link.active");
          if (prev) prev.classList.remove("active");
          const next = sidebar.querySelector("[data-select-card=\"" + id + "\"]");
          if (next) {
            next.classList.add("active");
            next.scrollIntoView({ block: "nearest" });
          }
        }

        history.pushState({ cardId: id }, "", cardHash(id));
      }

      function setRoute(hashValue, push) {
        if (push) history.pushState({}, "", hashValue);
        else history.replaceState({}, "", hashValue);
      }

      function replaceHistoryForFilterState() {
        const hashValue = window.location.hash || tabHash(state.activeTab);
        history.replaceState({}, "", hashValue);
      }

      function readLastTab() {
        try {
          const raw = localStorage.getItem(LAST_TAB_KEY);
          return raw && TAB_IDS.has(raw) ? raw : null;
        } catch (err) {
          return null;
        }
      }

      function writeLastTab(tabId) {
        if (!TAB_IDS.has(tabId)) return;
        try { localStorage.setItem(LAST_TAB_KEY, tabId); } catch (err) {}
      }

      function persistMix() {
        try {
          localStorage.setItem(MIX_STATE_KEY, JSON.stringify({
            mode: state.mix.mode, query: state.mix.query,
            descriptor: state.mix.descriptor, location: state.mix.location, cardId: state.mix.cardId
          }));
        } catch (err) {}
      }
      function restoreMix() {
        try {
          const raw = localStorage.getItem(MIX_STATE_KEY);
          if (!raw) return;
          const s = JSON.parse(raw);
          if (!s || typeof s !== "object") return;
          if (s.mode === "symptom" || s.mode === "descriptor" || s.mode === "location") state.mix.mode = s.mode;
          if (typeof s.query === "string") state.mix.query = s.query;
          state.mix.descriptor = (s.descriptor && MIX_DESCRIPTORS.indexOf(s.descriptor) >= 0) ? s.descriptor : null;
          state.mix.location = (s.location && MIX_LOCATIONS.indexOf(s.location) >= 0) ? s.location : null;
          state.mix.cardId = (s.cardId && MIX_INDEX[s.cardId]) ? s.cardId : null;
        } catch (err) {}
      }

      // SCREAM persists the current milestone marker and user-unlocked milestones.
      // The vocal-day check inputs are deliberately transient and never written to storage.
      function persistScream() {
        try { localStorage.setItem(SCREAM_STATE_KEY, JSON.stringify({ milestoneId: state.scream.milestoneId, unlocked: state.scream.unlocked })); } catch (err) {}
      }
      function restoreScream() {
        try {
          const raw = localStorage.getItem(SCREAM_STATE_KEY);
          if (!raw) return;
          const s = JSON.parse(raw);
          if (!s || typeof s !== "object") return;
          if (s.milestoneId && SCREAM_MS_INDEX[s.milestoneId]) state.scream.milestoneId = s.milestoneId;
          if (s.unlocked && typeof s.unlocked === "object") Object.keys(s.unlocked).forEach(function(id) {
            if (SCREAM_MS_INDEX[id] && s.unlocked[id]) state.scream.unlocked[id] = true;
          });
          // Backward compatibility with the temporary 4-state experiment: only Done becomes unlocked.
          if (s.statuses && typeof s.statuses === "object") Object.keys(s.statuses).forEach(function(id) {
            if (SCREAM_MS_INDEX[id] && s.statuses[id] === "done") state.scream.unlocked[id] = true;
          });
        } catch (err) {}
      }

      function activateFromLocation(pushIfMissingHash) {
        if (!window.location.hash && pushIfMissingHash) {
          const restored = readLastTab() || "layers";
          setRoute(tabHash(restored), false);
        }
        const parsed = parseHash(window.location.hash);
        state.activeTab = parsed.tab;
        state.activeLearnId = parsed.learnId;
        if (parsed.cardId && (parsed.cardId === "all-layers" || CARD_INDEX[parsed.cardId])) {
          state.selectedCardId = parsed.cardId;
        }
        if (parsed.recordId && RECORD_INDEX[parsed.recordId]) state.record.cardId = parsed.recordId;
        writeLastTab(parsed.tab);
        render();
      }

      function openTab(tabId, push) {
        if (!TAB_IDS.has(tabId)) return;
        state.activeTab = tabId;
        state.activeLearnId = null;
        writeLastTab(tabId);
        setRoute(tabHash(tabId), push);
        render();
      }

      function openLearn(learnId, push) {
        state.activeTab = "learn";
        state.activeLearnId = learnId;
        writeLastTab("learn");
        setRoute(learnHash(learnId), push);
        render();
      }

      function renderTabs() {
        const nav = document.getElementById("tabs");
        nav.innerHTML = TAB_DEFS.map((tab) => {
          const isActive = tab.id === state.activeTab;
          return "<button type=\"button\" class=\"tab-button\" data-tab=\"" + tab.id + "\" aria-current=\"" + (isActive ? "page" : "false") + "\">" + escapeHtml(tab.label) + "</button>";
        }).join("");
      }

      function renderList(items, ordered) {
        if (!items || !items.length) return "<p>None</p>";
        const tag = ordered ? "ol" : "ul";
        return "<" + tag + ">" + items.map((line) => "<li>" + escapeHtml(line) + "</li>").join("") + "</" + tag + ">";
      }

      function renderEvidence(evidence) {
        const genre = evidence && evidence.genreEvidence ? evidence.genreEvidence : [];
        const observable = evidence && evidence.observable ? evidence.observable : [];
        let html = "";
        if (genre.length) html += "<p><strong>GENRE_EVIDENCE</strong></p>" + renderList(genre, false);
        if (observable.length) html += "<p><strong>OBSERVABLE</strong></p>" + renderList(observable, false);
        return html || "<p>Missing evidence.</p>";
      }

      function renderLinks(links) {
        if (!links || !links.length) return "<p>None</p>";
        return "<ul>" + links.map((link) => {
          if (link.type === "learn") return "<li><a href=\"" + learnHash(link.learnId) + "\" data-why-learn-id=\"" + escapeHtml(link.learnId) + "\">" + escapeHtml(link.label) + "</a></li>";
          return "<li>" + escapeHtml(link.label || "link") + "</li>";
        }).join("") + "</ul>";
      }

      function renderWhy(whyIds) {
        if (!whyIds || !whyIds.length) return "<p>None</p>";
        return "<ul>" + whyIds.map((learnId) => {
          const node = LEARN_INDEX[learnId];
          const label = node ? node.title : learnId;
          return "<li><a href=\"" + learnHash(learnId) + "\" data-why-learn-id=\"" + escapeHtml(learnId) + "\">" + escapeHtml(label) + "</a></li>";
        }).join("") + "</ul>";
      }

      function renderVariants(variants) {
        if (!variants || !variants.length) return "";
        return "<div class=\"field\"><strong>VARIANTS</strong><ul class=\"variants-list\">" +
          variants.map((v) => "<li><strong>" + escapeHtml(v.name) + ":</strong> " + escapeHtml(v.note) + "</li>").join("") +
          "</ul></div>";
      }

      function renderSynonyms(synonyms) {
        if (!synonyms || !synonyms.length) return "";
        return "<div class=\"field\"><strong>SYNONYMS</strong><div>" +
          synonyms.map((s) => "<span class=\"chip synonym\">" + escapeHtml(s) + "</span>").join("") +
          "</div></div>";
      }

      function getCardCategory(card) {
        return card.layerCategory || (card.subtype === "modifier" ? "Modifiers" : (card.subtype === "bus" ? "Buses" : "Other"));
      }

      function resolveModifierDefaultMode(modifier) {
        if (!modifier || !modifier.placement) return "parallel";
        const mode = modifier.placement.mode;
        if (mode === "either") return modifier.placement.defaultMode || "parallel";
        if (mode === "parallel" || mode === "serial" || mode === "send-automated") return mode;
        return "parallel";
      }

      function resolveModifierState(modifier, card) {
        const category = getCardCategory(card);
        const compatible = modifier.compatible || [];
        const avoid = modifier.avoid || [];

        const cardCompatible = compatible.find((entry) => entry.targetType === "card" && entry.target === card.id);
        const categoryCompatible = compatible.find((entry) => entry.targetType === "category" && entry.target === category);
        const exceptedByCategory = categoryCompatible && Array.isArray(categoryCompatible.except) && categoryCompatible.except.indexOf(card.id) >= 0;

        const cardAvoid = avoid.find((entry) => entry.targetType === "card" && entry.target === card.id);
        const categoryAvoid = avoid.find((entry) => entry.targetType === "category" && entry.target === category);

        if (cardAvoid) {
          return { state: "avoid", reason: cardAvoid.reason || "Avoided for this card.", placement: null, source: "card-avoid" };
        }
        if (cardCompatible) {
          const placement = cardCompatible.placementOverride || modifier.placement;
          return { state: "explicit", reason: cardCompatible.notes || "Explicit card compatibility.", placement: placement, source: "card-compatible" };
        }
        if (categoryAvoid) {
          return { state: "avoid", reason: categoryAvoid.reason || "Avoided for this category.", placement: null, source: "category-avoid" };
        }
        if (categoryCompatible && !exceptedByCategory) {
          const placement = categoryCompatible.placementOverride || modifier.placement;
          return { state: "explicit", reason: categoryCompatible.notes || "Category compatibility.", placement: placement, source: "category-compatible" };
        }
        if (categoryCompatible && exceptedByCategory) {
          return { state: "avoid", reason: "Excepted from " + category + " compatibility for this card.", placement: null, source: "except-avoid" };
        }
        return { state: "default", reason: "Default-compatible by loose silence.", placement: modifier.placement, source: "default-silence" };
      }

      // Sonic-outcome buckets for the modifier exploration palette (Option A).
      const BRINGS_GROUPS = [
        { key: "body",      name: "Body & warmth",   desc: "fills out a thin or sterile lead" },
        { key: "clarity",   name: "Clarity",         desc: "recovers diction in a dense mix" },
        { key: "edge",      name: "Edge & grit",     desc: "adds bite on push moments" },
        { key: "character", name: "Character shift", desc: "vintage / lo-fi tonal contrast" },
        { key: "space",     name: "Space & depth",   desc: "dramatic spatial moments" }
      ];

      function modPlacementKind(modifier, result) {
        const placement = (result && result.placement) || modifier.placement;
        let mode = "parallel";
        if (placement && placement.mode) {
          mode = placement.mode === "either" ? (placement.defaultMode || "parallel") : placement.mode;
        }
        if (mode === "send-automated") return "send";
        if (mode === "serial") return "serial";
        return "parallel";
      }

      function renderModPlacementIcon(kind) {
        const iconKey = kind === "serial" ? "insert" : kind; // serial = in-series, reuses the insert glyph
        const icon = ROUTE_ICONS[iconKey] || ROUTE_ICONS.parallel;
        const label = kind === "send" ? "Send-automated" : kind === "serial" ? "Serial insert" : "Parallel blend";
        return "<span class=\"modp-icon mp-" + kind + "\" role=\"img\" aria-label=\"" + escapeHtml(label) + "\" title=\"" + label + "\">" + icon + "</span>";
      }

      function modShortName(title) {
        return title.replace(/\s+Modifier$/i, "");
      }

      function renderModTile(modifier, result) {
        const kind = modPlacementKind(modifier, result);
        const isDefault = result.state === "default";
        const stateCls = isDefault ? " is-default" : " is-explicit";
        const isEither = modifier.placement && modifier.placement.mode === "either";
        const eitherTag = isEither ? "<span class=\"modt-either\">or " + (kind === "serial" ? "parallel" : "serial") + "</span>" : "";
        // Three-state computed inverse: explicit (recommended) vs default-compatible (loose silence) vs avoid (separate block).
        const stateTag = isDefault
          ? "<span class=\"modt-state\" title=\"Compatible by default — inherited, not specifically calibrated for this layer\">default</span>"
          : "";
        const chips = (modifier.intent || []).map(function(i) { return "<span class=\"modt-chip\">" + escapeHtml(i) + "</span>"; }).join("");
        const reasonAttr = result.reason ? " title=\"" + escapeHtml(result.reason) + "\"" : "";
        return "<button type=\"button\" class=\"modt-tile mpe-" + kind + stateCls + "\" data-select-card=\"" + escapeHtml(modifier.id) + "\"" + reasonAttr + ">" +
          "<span class=\"modt-head\">" + renderModPlacementIcon(kind) + "<span class=\"modt-name\">" + escapeHtml(modShortName(modifier.title)) + "</span>" + stateTag + eitherTag + "</span>" +
          "<span class=\"modt-why\">" + escapeHtml(modifier.what || "") + "</span>" +
          (chips ? "<span class=\"modt-chips\">" + chips + "</span>" : "") +
        "</button>";
      }

      // Explicit-compatible modifiers rank above default-compatible within a group.
      function modTileSort(a, b) {
        const rank = function(s) { return s === "explicit" ? 0 : 1; };
        return rank(a.res.state) - rank(b.res.state);
      }

      function renderModifiersAccordion(card, modifiers) {
        const isOpen = !!state.modifiersOpen[card.id];
        const resolved = modifiers.map(function(m) { return { mod: m, res: resolveModifierState(m, card) }; });
        const explorable = resolved.filter(function(r) { return r.res.state !== "avoid"; });
        const avoided = resolved.filter(function(r) { return r.res.state === "avoid"; });

        let groupsHtml = "";
        const knownKeys = {};
        BRINGS_GROUPS.forEach(function(g) {
          knownKeys[g.key] = true;
          const items = explorable.filter(function(r) { return (r.mod.brings || "other") === g.key; }).sort(modTileSort);
          if (!items.length) return;
          groupsHtml += "<div class=\"modg\">" +
            "<div class=\"modg-head\"><span class=\"modg-name\">" + escapeHtml(g.name) + "</span><span class=\"modg-desc\">— " + escapeHtml(g.desc) + "</span></div>" +
            "<div class=\"modt-grid\">" + items.map(function(r) { return renderModTile(r.mod, r.res); }).join("") + "</div>" +
            "</div>";
        });
        const ungrouped = explorable.filter(function(r) { return !knownKeys[r.mod.brings]; });
        if (ungrouped.length) {
          groupsHtml += "<div class=\"modg\"><div class=\"modg-head\"><span class=\"modg-name\">Other</span></div>" +
            "<div class=\"modt-grid\">" + ungrouped.map(function(r) { return renderModTile(r.mod, r.res); }).join("") + "</div></div>";
        }

        let avoidHtml = "";
        if (avoided.length) {
          avoidHtml = "<div class=\"modavoid\"><p class=\"modavoid-label\">Not on this layer</p>" +
            avoided.map(function(r) {
              return "<div class=\"modavoid-row\"><span class=\"modavoid-x\">✗</span><div><span class=\"modavoid-name\">" + escapeHtml(modShortName(r.mod.title)) + "</span> — " + escapeHtml(r.res.reason || "") + "</div></div>";
            }).join("") +
            "</div>";
        }

        const arrowCls = isOpen ? " open" : "";
        const bodyAttr = isOpen ? "" : " hidden";
        return "<div class=\"mod-accordion\">" +
          "<button type=\"button\" class=\"mod-accordion-btn\" data-mod-toggle=\"" + escapeHtml(card.id) + "\"><span class=\"mod-arrow" + arrowCls + "\">▶</span>Modifiers<span style=\"color:var(--dim);font-weight:400;margin-left:6px;font-size:10px\">(" + explorable.length + ")</span></button>" +
          "<div class=\"mod-accordion-body\"" + bodyAttr + ">" + groupsHtml + avoidHtml + "</div>" +
          "</div>";
      }

      function renderDetailSection(label, content) {
        return "<div class=\"detail-section\"><div class=\"detail-label\">" + label + "</div>" + content + "</div>";
      }

      function renderWhy2(whyIds) {
        if (!whyIds || !whyIds.length) return "";
        const links = whyIds.map(function(learnId) {
          const node = LEARN_INDEX[learnId];
          const label = node ? node.title : learnId;
          return "<a class=\"why-link\" href=\"" + learnHash(learnId) + "\" data-why-learn-id=\"" + escapeHtml(learnId) + "\">" + escapeHtml(label) + "</a>";
        }).join("");
        return renderDetailSection("Why", "<div class=\"why-links\">" + links + "</div>");
      }

      function renderDetailList(items, isAdapt) {
        if (!items || !items.length) return "<p class=\"detail-text\">—</p>";
        const cls = isAdapt ? "detail-list adapt-list" : "detail-list";
        return "<ul class=\"" + cls + "\">" + items.map(function(t) { return "<li>" + escapeHtml(toTitleCase(t)) + "</li>"; }).join("") + "</ul>";
      }

      function toTitleCase(str) {
        if (!str) return str;
        return str.charAt(0).toUpperCase() + str.slice(1);
      }

      function renderChipRow(card) {
        const chips = [];
        // Colored category chip (with icon) is the card's primary identity — no separate subtype chip.
        const cat = displayCategory(card);
        const cm = categoryMeta(cat);
        chips.push("<span class=\"chip chip-category\" style=\"--cat-c:" + cm.color + "\">" + cm.icon + escapeHtml(cat) + "</span>");
        for (const r of (card.sectionRole || [])) chips.push("<span class=\"chip chip-role\">" + escapeHtml(toTitleCase(r)) + "</span>");
        for (const i of (card.intent || [])) chips.push("<span class=\"chip chip-intent\">" + escapeHtml(toTitleCase(i)) + "</span>");
        return "<div class=\"card-meta\">" + chips.join("") + "</div>";
      }

      function renderSynonymsInline(synonyms) {
        if (!synonyms || !synonyms.length) return "";
        return renderDetailSection("Also known as", "<div style=\"display:flex;flex-wrap:wrap;gap:5px\">" + synonyms.map(function(s) { return "<span class=\"chip chip-synonym\">" + escapeHtml(s) + "</span>"; }).join("") + "</div>");
      }

      function renderLayerRecipeCard(card, modifiers) {
        const usesNewSchema = Array.isArray(card.implementationSections) && card.implementationSections.length > 0;
        let html = "<div class=\"card-header\">";
        html += "<h2 class=\"card-title\">" + escapeHtml(card.title) + "</h2>";
        html += renderChipRow(card);
        html += "</div>";
        html += "<p class=\"card-what\">" + card.what + "</p>";
        const synonymsHtml = renderSynonymsInline(card.synonyms);
        const variantsHtml = (card.variants && card.variants.length)
          ? renderDetailSection("Variants", "<ul class=\"variants-list\">" + card.variants.map(function(v) { return "<li><strong>" + escapeHtml(v.name) + ":</strong> " + escapeHtml(v.note) + "</li>"; }).join("") + "</ul>")
          : "";

        if (usesNewSchema) {
          // Three-column: Summary | Implementation | Details.
          // SYNONYMS + VARIANTS live in the summary column (not the header) so the
          // Implementation / Details columns pin to a consistent y across all layer cards.
          let summary = "";
          summary += synonymsHtml;
          summary += variantsHtml;
          summary += renderDetailSection("When", renderDetailList(card.when, false));
          if (card.take) {
            let takeHtml = "<p class=\"detail-text\">" + escapeHtml(card.take.capture) + "</p>";
            if (card.take.direction) {
              takeHtml += "<div class=\"direction-block\"><div class=\"dir-label\">Direction</div><p><strong>Focus:</strong> " + escapeHtml(card.take.direction.focus) + "</p><p><strong>Prompt:</strong> " + escapeHtml(card.take.direction.prompt) + "</p></div>";
            }
            if (card.take.recordRef && RECORD_INDEX[card.take.recordRef]) {
              takeHtml += "<p class=\"detail-text\"><a href=\"" + recordHash(card.take.recordRef) + "\" data-record-link=\"" + escapeHtml(card.take.recordRef) + "\">Capture baseline → " + escapeHtml(RECORD_INDEX[card.take.recordRef].character) + "</a></p>";
            }
            summary += renderDetailSection("Take", takeHtml);
          }
          summary += renderDetailSection("Align", renderDetailList(card.align, false));
          summary += renderDetailSection("Adapt if", renderDetailList(card.adaptIf, true));
          summary += renderWhy2(card.why);
          summary += renderDetailSection("Modifiers", renderModifiersAccordion(card, modifiers));

          let impl = "<div class=\"impl-panel\"><div class=\"impl-panel-label\">Implementation</div>";
          impl += renderImplementationSections(card);
          impl += "</div>";

          const details = "<div class=\"col-details-inner\" id=\"details-column\">" + renderDetailsColumn() + "</div>";

          html += "<div class=\"layer-detail-3col\">" +
            "<div class=\"col-summary\">" + summary + "</div>" +
            "<div class=\"col-implementation\">" + impl + "</div>" +
            "<div class=\"col-details\">" + details + "</div>" +
            "</div>";
        } else {
          // Legacy (un-migrated) cards keep synonyms/variants in the header.
          html += synonymsHtml;
          html += variantsHtml;
          html += renderDetailSection("When", renderDetailList(card.when, false));
          if (card.take) {
            let takeHtml = "<p class=\"detail-text\">" + escapeHtml(card.take.capture) + "</p>";
            if (card.take.direction) {
              takeHtml += "<div class=\"direction-block\"><div class=\"dir-label\">Direction</div><p><strong>Focus:</strong> " + escapeHtml(card.take.direction.focus) + "</p><p><strong>Prompt:</strong> " + escapeHtml(card.take.direction.prompt) + "</p></div>";
            }
            if (card.take.recordRef && RECORD_INDEX[card.take.recordRef]) {
              takeHtml += "<p class=\"detail-text\"><a href=\"" + recordHash(card.take.recordRef) + "\" data-record-link=\"" + escapeHtml(card.take.recordRef) + "\">Capture baseline → " + escapeHtml(RECORD_INDEX[card.take.recordRef].character) + "</a></p>";
            }
            html += renderDetailSection("Take", takeHtml);
          }
          html += renderDetailSection("Align", renderDetailList(card.align, false));
          html += renderDetailSection("Chain", renderChainFlow(card.chain));
          html += renderDetailSection("Modifiers", renderModifiersAccordion(card, modifiers));
          html += renderDetailSection("Adapt if", renderDetailList(card.adaptIf, true));
          html += renderWhy2(card.why);
        }
        return html;
      }

      // ── Structured chain renderers (v0.2.5) ─────────────────────────────

      function renderSignalFlowChips(flow) {
        if (!flow || !flow.length) return "";
        const parts = flow.map(function(kind) {
          const meta = STAGE_META[kind] || STAGE_META.other;
          return "<span class=\"signal-chip " + meta.cls + "\">" + escapeHtml(meta.label) + "</span>";
        });
        return "<div class=\"signal-flow\">" + parts.join("<span class=\"signal-arrow\">›</span>") + "</div>";
      }

      const ROUTE_EDGE_LABELS = {
        insert: "insert · in series",
        send: "send · parallel tap",
        sidechain: "sidechain key · control signal",
        parallel: "parallel · duplicate path",
        return: "return",
        to: "to"
      };

      const ROUTE_ICONS = {
        /* insert — bold solid arrow (Option C) */
        insert:
          '<svg viewBox="0 0 20 12" width="18" height="11" aria-hidden="true">' +
            '<path d="M1 6 H15" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round"/>' +
            '<path d="M12 2.5 L15 6 L12 9.5" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' +
          '</svg>',
        /* send — corner arrow ↱ (Option B) */
        send:
          '<svg viewBox="0 0 18 14" width="16" height="13" aria-hidden="true">' +
            '<path d="M2 13 H12 V4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' +
            '<path d="M9 6 L12 3 L15 6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' +
          '</svg>',
        /* sidechain — dashed thin arrow (Option C, switched to dashes per user note) */
        sidechain:
          '<svg viewBox="0 0 22 10" width="20" height="9" aria-hidden="true">' +
            '<path d="M1 5 H17" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-dasharray="2.2 2"/>' +
            '<path d="M14 2 L17 5 L14 8" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' +
          '</svg>',
        /* parallel — double arrow ⇉ (Option B) */
        parallel:
          '<svg viewBox="0 0 22 12" width="20" height="11" aria-hidden="true">' +
            '<path d="M1 3 H17" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>' +
            '<path d="M14 0.5 L17 3 L14 5.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' +
            '<path d="M1 9 H17" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>' +
            '<path d="M14 6.5 L17 9 L14 11.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' +
          '</svg>',
        /* return — curved u-turn (unchanged across all options) */
        return:
          '<svg viewBox="0 0 24 14" width="22" height="13" aria-hidden="true">' +
            '<path d="M2 11 H16 A4 4 0 0 0 16 3 H9" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' +
            '<path d="M12 0.5 L9 3 L12 5.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' +
          '</svg>',
        /* to — thin plain arrow (Option C) */
        to:
          '<svg viewBox="0 0 16 8" width="14" height="7" aria-hidden="true">' +
            '<path d="M1 4 H13.5" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linecap="round"/>' +
            '<path d="M11 1.5 L13.5 4 L11 6.5" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' +
          '</svg>'
      };

      function renderRouteEdge(kind) {
        const k = ROUTE_ICONS[kind] ? kind : "to";
        const icon = ROUTE_ICONS[k];
        const label = ROUTE_EDGE_LABELS[k] || k;
        return '<span class="rf-edge e-' + k + '" role="img" title="' + escapeHtml(label) + '" aria-label="' + escapeHtml(label) + '">' + icon + '</span>';
      }

      function renderRouteNode(item) {
        const role = item.role || "default";
        return '<span class="rf-node r-' + escapeHtml(role) + '">' + escapeHtml(item.node) + '</span>';
      }

      function renderRouteSeq(items) {
        return (items || []).map(function(it) {
          if (it && it.node) return renderRouteNode(it);
          if (it && it.edge) return renderRouteEdge(it.edge);
          return "";
        }).join("");
      }

      // ── General routing diagram (SVG) ───────────────────────────────────
      // ONE renderer for every card's structured `routing`. normalizeRouting() folds
      // both the `converge` shape (multi-source → shared bus) and the legacy
      // `main` + `branches` shape into a single model; renderRoutingDiagram() draws it:
      //   • sources (1..N) stacked left, merging into the spine
      //   • spine: bus chain → master, left → right
      //   • sends: an FX node above the spine, returning into a bus (dashed, blue)
      //   • duck: a lead-keyed dashed 90° arrow up into its target (bus or source track)
      // Direction is correct by construction — the duck key always points INTO the ducked node.
      function normalizeRouting(routing) {
        if (!routing) return null;
        if (routing.converge) {
          const cv = routing.converge;
          const tail = cv.tail || [];
          const spine = [{ label: cv.bus || "Bus", role: "bus" }];
          tail.forEach(function (t, i) { spine.push({ label: t, role: i === tail.length - 1 ? "master" : "bus" }); });
          return {
            sources: (cv.sources || []).slice(),
            spine: spine,
            duck: cv.duck ? { key: cv.duck.key || "Lead", on: cv.duck.on === "source" ? "source" : "bus" } : null,
            feeds: (cv.sends || []).map(function (sd) { return { name: sd.name, returnTo: sd.returnTo || null, kind: sd.kind === "parallel" ? "parallel" : "send" }; })
          };
        }
        if (routing.main && routing.main.length) {
          const nodes = routing.main.filter(function (it) { return it && it.node; });
          const sources = [];
          let i = 0;
          while (i < nodes.length && nodes[i].role === "source") { sources.push(nodes[i].node); i++; }
          if (!sources.length && nodes.length) { sources.push(nodes[0].node); i = 1; }
          const spine = [];
          for (; i < nodes.length; i++) { spine.push({ label: nodes[i].node, role: nodes[i].role || "bus" }); }
          const feeds = [];
          let duck = null;
          (routing.branches || []).forEach(function (b) {
            const bnodes = (b.nodes || []).filter(function (n) { return n && n.node; });
            if (b.edge === "send" || b.edge === "parallel") {
              const fx = bnodes[0], ret = bnodes[bnodes.length - 1];
              feeds.push({ name: fx ? fx.node : "FX", returnTo: (ret && ret !== fx) ? ret.node : null, kind: b.edge === "parallel" ? "parallel" : "send" });
            } else if (b.edge === "sidechain") {
              // Honor the authored key node (first node of the branch) rather than assuming "Lead".
              // A main/branches sidechain ducks the layer's first bus; source-ducks use the converge shape.
              const keyNode = bnodes[0];
              duck = { key: (keyNode && keyNode.node) || "Lead", on: "bus" };
            }
          });
          return { sources: sources, spine: spine, duck: duck, feeds: feeds };
        }
        return null;
      }

      function renderRoutingDiagram(routing) {
        const model = normalizeRouting(routing);
        if (!model || !model.sources.length || !model.spine.length) return "";
        const COL = { source: "#f0a46f", bus: "#80d8b3", master: "#9fb0c3", bad: "#f08b8b", fx: "#8fb6c9", parallel: "#b7a0d8", send: "#80d8b3" };
        function pill(x, y, text, role) {
          const fs = 12, h = 26, pad = 11;
          const w = text.length * 7.0 + pad * 2;
          const c = COL[role] || "#9fb0c3";
          const fill = role === "master" ? "transparent" : "#131920";
          const bg = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (h / 2) + '" fill="' + fill + '" stroke="' + c + '" stroke-opacity="0.5" stroke-width="1.3"/>';
          const t = '<text x="' + (x + w / 2) + '" y="' + (y + h / 2 + fs * 0.35) + '" text-anchor="middle" font-size="' + fs + '" font-weight="600" fill="' + c + '" font-family="Segoe UI,sans-serif">' + escapeHtml(text) + '</text>';
          return { svg: bg + t, role: role, label: text, x: x, y: y, w: w, h: h, cx: x + w / 2, cy: y + h / 2, left: x, right: x + w, top: y, bottom: y + h };
        }
        function head(x2, y2, ang, color, sw) {
          const L = 8;
          const ax = x2 - L * Math.cos(ang - 0.42), ay = y2 - L * Math.sin(ang - 0.42);
          const bx = x2 - L * Math.cos(ang + 0.42), by = y2 - L * Math.sin(ang + 0.42);
          return '<path d="M' + ax + ' ' + ay + ' L' + x2 + ' ' + y2 + ' L' + bx + ' ' + by + '" fill="none" stroke="' + color + '" stroke-width="' + sw + '" stroke-linecap="round" stroke-linejoin="round"/>';
        }
        function solidArrow(x1, y1, x2, y2, color) {
          return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color + '" stroke-width="2" stroke-linecap="round"/>' + head(x2, y2, Math.atan2(y2 - y1, x2 - x1), color, 2);
        }
        // horizontal then vertical, arrow points up (into a node's bottom)
        function elbowHV(x1, y1, turnX, y2, color, dashed) {
          const da = dashed ? ' stroke-dasharray="4 3"' : '';
          const sw = dashed ? 1.8 : 2;
          return '<path d="M' + x1 + ' ' + y1 + ' H' + turnX + ' V' + y2 + '" fill="none" stroke="' + color + '" stroke-width="' + sw + '"' + da + ' stroke-linejoin="round"/>' + head(turnX, y2, Math.atan2(-1, 0), color, sw);
        }
        // transparent fat hit areas + clickable wrapper → opens the routing-types LEARN card
        function hitLine(x1, y1, x2, y2) { return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="transparent" stroke-width="14" stroke-linecap="round"/>'; }
        function hitPath(d) { return '<path d="' + d + '" fill="none" stroke="transparent" stroke-width="14"/>'; }
        function edge(kind, inner) {
          return '<g class="rf-edge-hit" data-route-edge="' + kind + '" data-why-learn-id="learn.routing.types" tabindex="0" role="button" aria-label="' + kind + ' routing — open explanation">' + inner + '</g>';
        }

        const sources = model.sources, N = sources.length;
        const rowH = 44, pillH = 26, top = 16;
        const feeds = model.feeds || [];
        const hasFeeds = feeds.length > 0;
        const railX = 4;                       // left rail for the feed tap (source → FX)
        const colX = hasFeeds ? 16 : 8;        // leave room for the rail when there are feeds
        const duckOnSource = model.duck && model.duck.on === "source";

        // LEFT COLUMN (all at the same x): sources, then the duck-lead, then the send/parallel FX.
        // Each non-source node gets its own 90° arrow over to its destination on the spine.
        const entries = [];
        sources.forEach(function (label) { entries.push({ kind: "source", label: label }); });
        if (model.duck) entries.push({ kind: "duck", label: model.duck.key || "Lead" });
        feeds.forEach(function (fd) { entries.push({ kind: fd.kind, label: fd.name, returnTo: fd.returnTo }); });

        const colPills = entries.map(function (e, i) {
          const role = e.kind === "parallel" ? "parallel" : (e.kind === "send" ? "send" : "source");
          const p = pill(colX, top + i * rowH, e.label, role);
          p.kind = e.kind; p.returnTo = e.returnTo;
          return p;
        });
        const srcPills = colPills.slice(0, N);
        const leadPill = model.duck ? colPills[N] : null;
        const feedPills = colPills.filter(function (p) { return p.kind === "send" || p.kind === "parallel"; });
        const busCy = (srcPills[0].cy + srcPills[N - 1].cy) / 2;
        const maxColRight = Math.max.apply(null, colPills.map(function (p) { return p.right; }));
        const jx = maxColRight + 16;

        // spine pills (to the right of the whole column)
        const spinePills = [];
        let cursorX = jx + 34;
        model.spine.forEach(function (sp) {
          const p = pill(cursorX, busCy - pillH / 2, sp.label, sp.role);
          spinePills.push(p);
          cursorX = p.right + 44;
        });

        const colBottom = colPills[colPills.length - 1].bottom;
        const W = cursorX + 4;
        const H = Math.max(colBottom, spinePills[spinePills.length - 1].bottom) + 18;

        let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="route-svg" role="img" aria-label="Routing diagram">';
        // merge (insert): sources → junction → first spine node
        let mergeInner = '';
        srcPills.forEach(function (p) {
          mergeInner += hitLine(p.right, p.cy, jx, p.cy) + '<line x1="' + p.right + '" y1="' + p.cy + '" x2="' + jx + '" y2="' + p.cy + '" stroke="' + COL.source + '" stroke-width="2"/>';
        });
        if (N > 1) mergeInner += '<line x1="' + jx + '" y1="' + srcPills[0].cy + '" x2="' + jx + '" y2="' + srcPills[N - 1].cy + '" stroke="' + COL.source + '" stroke-width="2"/>';
        mergeInner += hitLine(jx, busCy, spinePills[0].left, busCy) + solidArrow(jx, busCy, spinePills[0].left, busCy, COL.source);
        s += edge("insert", mergeInner);
        // feeds: source → FX (down the left rail) then FX → its bus (return). Solid, colored by kind.
        feedPills.forEach(function (p) {
          const col = p.kind === "parallel" ? COL.parallel : COL.send;
          let ret = p.returnTo ? spinePills.find(function (sp) { return sp.label === p.returnTo; }) : null;
          if (!ret) ret = spinePills[0];
          const src = srcPills[0];
          const tapD = 'M' + src.left + ' ' + src.cy + ' H' + railX + ' V' + p.cy + ' H' + p.left;
          let inner = hitPath(tapD) + '<path d="' + tapD + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round"/>' + head(p.left, p.cy, Math.atan2(0, 1), col, 2);
          const retD = 'M' + p.right + ' ' + p.cy + ' H' + ret.cx + ' V' + ret.bottom;
          inner += hitPath(retD) + elbowHV(p.right, p.cy, ret.cx, ret.bottom, col, false);
          s += edge(p.kind, inner);
        });
        // spine arrows (colored by destination role)
        for (let k = 1; k < spinePills.length; k++) {
          const dest = spinePills[k];
          s += edge("to", hitLine(spinePills[k - 1].right, busCy, dest.left, busCy) + solidArrow(spinePills[k - 1].right, busCy, dest.left, busCy, dest.role === "master" ? COL.master : COL.bus));
        }
        // duck: dashed 90° elbow up into the target (bus by default, or the source track)
        if (leadPill) {
          const dt = duckOnSource ? srcPills[N - 1] : spinePills[0];
          const dD = 'M' + leadPill.right + ' ' + leadPill.cy + ' H' + dt.cx + ' V' + dt.bottom;
          let inner = hitPath(dD) + elbowHV(leadPill.right, leadPill.cy, dt.cx, dt.bottom, COL.bad, true);
          inner += '<text x="' + (dt.cx + 24) + '" y="' + (dt.bottom + 14) + '" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="0.5" fill="' + COL.bad + '" font-family="Segoe UI,sans-serif">Duck</text>';
          s += edge("sidechain", inner);
        }
        // pills on top
        colPills.forEach(function (p) { s += p.svg; });
        spinePills.forEach(function (p) { s += p.svg; });
        s += '</svg>';
        return s;
      }

      function renderRoutingBlock(routing) {
        if (!routing) return "";
        // Unified SVG diagram for any structured routing (converge OR main + branches).
        if (routing.converge || (routing.main && routing.main.length)) {
          const diagram = renderRoutingDiagram(routing);
          if (diagram) {
            let html = '<div class="route-flow">' + diagram;
            if (routing.notes) html += '<div class="rf-notes">' + escapeHtml(routing.notes) + '</div>';
            html += '</div>';
            return html;
          }
        }
        // Legacy text fallback
        let html = "<div class=\"routing-block\">";
        if (routing.topology) html += "<div class=\"routing-topology\">" + escapeHtml(routing.topology) + "</div>";
        if (routing.sends && routing.sends.length) {
          html += "<div class=\"routing-sends\">Sends: " + routing.sends.map(escapeHtml).join(" · ") + "</div>";
        }
        if (routing.notes) html += "<div class=\"routing-notes\">" + escapeHtml(routing.notes) + "</div>";
        html += "</div>";
        return html;
      }

      function renderSourceSup(sources) {
        if (!sources || !sources.length) return "";
        const json = JSON.stringify(sources).replace(/"/g, "&quot;");
        const titleText = sources.map(function(s) {
          return "• " + s.title + (s.quality ? " (" + s.quality + ")" : "") + (s.url ? "\n  " + s.url : "");
        }).join("\n");
        return "<span class=\"src-sup\" data-sources=\"" + json + "\" title=\"" + escapeHtml(titleText) + "\" tabindex=\"0\" aria-label=\"" + sources.length + " source" + (sources.length > 1 ? "s" : "") + "\">" + sources.length + "</span>";
      }

      function renderDefaultValue(dv) {
        const valueText = escapeHtml(dv.value);
        const sup = renderSourceSup(dv.sources);
        const interp = dv.basis === "interpretation" ? "<span class=\"interp-chip\" title=\"operator interpretation — verify\">interp</span>"
          : (dv.basis === "research" ? "<span class=\"interp-chip research-chip\" title=\"from web research — verify against your source\">research</span>" : "");
        let dd = "<dd>" + valueText + sup + interp;
        if (dv.note) dd += "<span class=\"dv-note\">" + escapeHtml(dv.note) + "</span>";
        dd += "</dd>";
        return "<dt>" + escapeHtml(dv.control) + "</dt>" + dd;
      }

      function renderUsefulPresets(items) {
        if (!items || !items.length) return "";
        return "<div class=\"useful-presets\">" + items.map(function(item) {
          return "<div class=\"useful-preset\">" +
            "<span class=\"useful-preset-name\">" + escapeHtml(item.name) + "</span>" +
            "<span class=\"useful-preset-note\">" + escapeHtml(item.note || "") + "</span>" +
            "</div>";
        }).join("") + "</div>";
      }

      function getUsefulPresets(cardId, idx, step) {
        if (step.usefulPresets && step.usefulPresets.length) return step.usefulPresets;
        const cardSuggestions = CARD_PRESET_SUGGESTIONS[cardId];
        return cardSuggestions ? (cardSuggestions[idx] || []) : [];
      }

      function toneClass(stage) {
        return "tone-" + (stage || "other");
      }

      function renderChainStep(step, idx, cardId) {
        const meta = STAGE_META[step.stage] || STAGE_META.other;
        const tone = toneClass(step.stage);
        const stepKey = cardId + ":step:" + idx;
        const open = !!state.chainStepsOpen[stepKey];
        const placement = step.placement && step.placement !== "insert" ? step.placement : null;
        let placementCell = "<span class=\"cstep-placement\"></span>";
        if (placement && ROUTE_ICONS[placement]) {
          const label = ROUTE_EDGE_LABELS[placement] || placement;
          placementCell = "<span class=\"cstep-placement p-" + placement + "\" role=\"img\" title=\"" + escapeHtml(label) + "\" aria-label=\"" + escapeHtml(label) + "\">" + ROUTE_ICONS[placement] + "</span>";
        }
        let head = "<button type=\"button\" class=\"cstep-head\" data-cstep-toggle=\"" + escapeHtml(stepKey) + "\" aria-expanded=\"" + (open ? "true" : "false") + "\">";
        head += "<span class=\"cstep-num\">" + (idx + 1) + ".</span>";
        head += "<span class=\"cstep-stage " + meta.cls + "\">" + escapeHtml(meta.label) + "</span>";
        head += placementCell;
        // Pluginless step (placement / level / automation / capture / arrangement): label is plain text, no pill.
        const hasPlugin = !!step.pluginId;
        const headLabel = step.pluginLabel || step.pluginId || meta.label;
        head += "<span class=\"cstep-plugin " + (hasPlugin ? tone : "cstep-noplugin") + "\">" + escapeHtml(headLabel) + "</span>";
        head += "<span class=\"cstep-role\">" + escapeHtml(step.role || "") + "</span>";
        head += "<span class=\"cstep-arrow" + (open ? " open" : "") + "\">▶</span>";
        head += "</button>";

        const presetChip = step.preset ? "<span class=\"cstep-preset\">" + escapeHtml(step.preset) + "</span>" : "";

        let body = "<div class=\"cstep-body\"" + (open ? "" : " hidden") + " data-cstep-body=\"" + escapeHtml(stepKey) + "\">";
        if (hasPlugin) {
          const pluginPill = "<button type=\"button\" class=\"plugin-pill " + tone + "\" data-plugin-id=\"" + escapeHtml(step.pluginId) + "\" aria-expanded=\"false\">" + escapeHtml(step.pluginLabel || step.pluginId) + "</button>";
          body += "<div class=\"cstep-sub\">Plugin</div>";
          body += "<p style=\"margin:0\">" + pluginPill + presetChip + "</p>";
        }

        if (step.defaults && step.defaults.length) {
          body += "<div class=\"cstep-sub\">Defaults</div>";
          body += "<dl class=\"cstep-defaults\">" + step.defaults.map(renderDefaultValue).join("") + "</dl>";
        }
        const usefulPresets = getUsefulPresets(cardId, idx, step);
        if (usefulPresets.length) {
          body += "<div class=\"cstep-sub\">Useful presets</div>";
          body += renderUsefulPresets(usefulPresets);
        }
        // EQ-stage steps show the card's EQ response curve (Diagram B) inline.
        if (step.stage === "eq") {
          const ownerCard = CARD_INDEX[cardId];
          if (ownerCard && ownerCard.eqCurve) body += renderEqCurve(ownerCard.eqCurve);
        }
        if (step.setLikeThis) {
          body += "<div class=\"cstep-sub\">Set it like this</div>";
          body += "<p class=\"cstep-set\">" + escapeHtml(step.setLikeThis) + "</p>";
        }
        if (step.adapt && step.adapt.length) {
          body += "<div class=\"cstep-sub\">Adapt to my vocal</div>";
          body += "<ul class=\"cstep-adapt\">" + step.adapt.map(function(a) {
            return "<li><strong>" + escapeHtml(a.trait) + ":</strong> " + escapeHtml(a.action) + "</li>";
          }).join("") + "</ul>";
        }
        if (step.mistake) {
          body += "<div class=\"cstep-sub\">Common mistake</div>";
          body += "<p class=\"cstep-mistake\">" + escapeHtml(step.mistake) + "</p>";
        }
        if (step.alternatives && step.alternatives.length) {
          body += "<div class=\"cstep-sub\">Alternatives</div>";
          body += "<div class=\"cstep-alts\">" + step.alternatives.map(function(alt) {
            const label = escapeHtml(alt.pluginLabel || alt.pluginId || "");
            // Only registered plugins get a clickable drawer pill; unregistered alternatives
            // render as a plain label (no data-plugin-id) so they never open "reference missing".
            const altPill = (alt.pluginId && PLUGIN_CARDS[alt.pluginId])
              ? "<button type=\"button\" class=\"plugin-pill " + tone + "\" data-plugin-id=\"" + escapeHtml(alt.pluginId) + "\" aria-expanded=\"false\">" + label + "</button>"
              : "<span class=\"plugin-pill plugin-pill-static " + tone + "\">" + label + "</span>";
            return "<div class=\"cstep-alt\">" + altPill + " <span>" + escapeHtml(alt.characterNote || "") + "</span></div>";
          }).join("") + "</div>";
        }
        body += "</div>";
        return "<div class=\"cstep\">" + head + body + "</div>";
      }

      // Diagram A — stereo pan map (pan arc + value table) from card.panLayers.
      function renderPanMap(panLayers) {
        if (!panLayers || !panLayers.length) return "";
        const W = 330, H = 150, cx = W / 2, cy = 128, R = 98;
        const col = { lead: "#f0a46f", dbl: "#8fb6c9", outer: "#b7a0d8" };
        const rByDb = function(db) { return 5 + (6 + (db || 0)) * 0.9; };
        let s = "<svg viewBox=\"0 0 " + W + " " + H + "\" class=\"panmap-svg\" role=\"img\" aria-label=\"Stereo pan map\">";
        s += "<path d=\"M " + (cx - R) + " " + cy + " A " + R + " " + R + " 0 0 1 " + (cx + R) + " " + cy + "\" fill=\"none\" stroke=\"var(--line)\" stroke-width=\"2\"/>";
        s += "<line x1=\"" + cx + "\" y1=\"" + cy + "\" x2=\"" + cx + "\" y2=\"" + (cy - R - 6) + "\" stroke=\"var(--dim)\" stroke-dasharray=\"2 3\"/>";
        s += "<text x=\"" + (cx - R) + "\" y=\"" + (cy + 14) + "\" class=\"panmap-ax\" text-anchor=\"middle\">L 100%</text>";
        s += "<text x=\"" + (cx + R) + "\" y=\"" + (cy + 14) + "\" class=\"panmap-ax\" text-anchor=\"middle\">R 100%</text>";
        s += "<text x=\"" + cx + "\" y=\"" + (cy - R - 10) + "\" class=\"panmap-ax\" text-anchor=\"middle\">C</text>";
        panLayers.forEach(function(l) {
          const th = (l.pan / 100) * (Math.PI / 2);
          const x = cx + R * Math.sin(th), y = cy - R * Math.cos(th), r = rByDb(l.db);
          const c = col[l.role] || "#9fb0c3";
          s += "<line x1=\"" + cx + "\" y1=\"" + cy + "\" x2=\"" + x.toFixed(1) + "\" y2=\"" + y.toFixed(1) + "\" stroke=\"" + c + "\" stroke-opacity=\"0.22\"/>";
          s += "<circle cx=\"" + x.toFixed(1) + "\" cy=\"" + y.toFixed(1) + "\" r=\"" + r.toFixed(1) + "\" fill=\"" + c + "\" fill-opacity=\"0.85\"/>";
          s += "<text x=\"" + x.toFixed(1) + "\" y=\"" + (y - r - 3).toFixed(1) + "\" class=\"panmap-lbl\" text-anchor=\"middle\">" + escapeHtml(l.name) + "</text>";
        });
        s += "</svg>";
        const panTxt = function(p) { return p === 0 ? "center" : (p < 0 ? "L " + Math.abs(p) + "%" : "R " + Math.abs(p) + "%"); };
        let t = "<table class=\"panmap-vt\"><tr><th>Layer</th><th>Pan</th><th>Level</th></tr>";
        panLayers.forEach(function(l) {
          const c = col[l.role] || "#9fb0c3";
          t += "<tr><td class=\"nm\"><span class=\"panmap-dot\" style=\"background:" + c + "\"></span>" + escapeHtml(l.name) + "</td>" +
               "<td>" + panTxt(l.pan) + "</td><td>" + (l.db === 0 ? "0 dB" : (l.db + " dB")) + "</td></tr>";
        });
        t += "</table>";
        return "<div class=\"panmap\"><div class=\"panmap-label\">Stereo placement</div>" + s + t + "</div>";
      }

      // Diagram B — EQ response curve (HPF + bands + optional LPF) from card.eqCurve.
      // eqCurve: { hpf, slope, bands:[{f,gain,q,label}], lpf, lpfSlope, note }
      function renderEqCurve(eq) {
        if (!eq || (!eq.hpf && !(eq.bands && eq.bands.length) && !eq.lpf)) return "";
        const FMIN = 20, FMAX = 20000, W = 330, H = 150, pad = 18, dbTop = 6, dbBot = -26;
        const slope = eq.slope || 24;
        const fx = function(f) { return pad + (Math.log10(f) - Math.log10(FMIN)) / (Math.log10(FMAX) - Math.log10(FMIN)) * (W - 2 * pad); };
        const yOf = function(db) { return pad + (dbTop - db) / (dbTop - dbBot) * (H - 2 * pad - 10); };
        const dbAt = function(f) {
          let db = 0;
          if (eq.hpf) { if (f < eq.hpf) db += slope * Math.log2(f / eq.hpf); db += -3 * Math.exp(-Math.pow(Math.log2(f / eq.hpf), 2) / 0.04); }
          if (eq.lpf) { if (f > eq.lpf) db += (eq.lpfSlope || slope) * Math.log2(eq.lpf / f); }
          (eq.bands || []).forEach(function(b) { db += b.gain * Math.exp(-Math.pow(Math.log2(f / b.f) * (b.q || 1), 2)); });
          return Math.max(db, -30);
        };
        let d = "";
        for (let i = 0; i <= 80; i++) { const f = FMIN * Math.pow(FMAX / FMIN, i / 80); const x = fx(f), y = yOf(dbAt(f)); d += (i === 0 ? "M " : " L ") + x.toFixed(1) + " " + y.toFixed(1); }
        const GRIDF = [100, 1000, 10000];
        let s = "<svg viewBox=\"0 0 " + W + " " + H + "\" class=\"eqcurve-svg\" role=\"img\" aria-label=\"EQ response curve\">";
        GRIDF.forEach(function(f) { const x = fx(f); s += "<line x1=\"" + x.toFixed(1) + "\" y1=\"" + pad + "\" x2=\"" + x.toFixed(1) + "\" y2=\"" + (H - pad - 10) + "\" stroke=\"var(--line)\" stroke-opacity=\"0.45\"/>"; });
        s += "<line x1=\"" + pad + "\" y1=\"" + yOf(0) + "\" x2=\"" + (W - pad) + "\" y2=\"" + yOf(0) + "\" stroke=\"var(--line)\"/>";
        s += "<path d=\"" + d + " L " + (W - pad) + " " + (H - pad - 10) + " L " + pad + " " + (H - pad - 10) + " Z\" fill=\"var(--accent)\" fill-opacity=\"0.12\"/>";
        s += "<path d=\"" + d + "\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\"/>";
        if (eq.hpf) { const hx = fx(eq.hpf); s += "<line x1=\"" + hx.toFixed(1) + "\" y1=\"" + pad + "\" x2=\"" + hx.toFixed(1) + "\" y2=\"" + (H - pad - 10) + "\" stroke=\"var(--accent)\" stroke-opacity=\"0.4\" stroke-dasharray=\"2 2\"/>"; s += "<text x=\"" + (hx + 3).toFixed(1) + "\" y=\"" + (pad + 9) + "\" class=\"eqcurve-lbl\" fill=\"var(--accent)\">HPF " + eq.hpf + " Hz · " + slope + " dB/oct</text>"; }
        (eq.bands || []).forEach(function(b) { const mx = fx(b.f), my = yOf(b.gain); s += "<circle cx=\"" + mx.toFixed(1) + "\" cy=\"" + my.toFixed(1) + "\" r=\"2.6\" fill=\"var(--accent)\"/>"; s += "<text x=\"" + (mx + 5).toFixed(1) + "\" y=\"" + (my + 3).toFixed(1) + "\" class=\"eqcurve-lbl\" fill=\"var(--muted)\">" + b.f + " Hz · " + (b.gain > 0 ? "+" : "") + b.gain + " dB" + (b.q ? " · Q " + b.q : "") + "</text>"; });
        if (eq.lpf) { const lx = fx(eq.lpf); s += "<line x1=\"" + lx.toFixed(1) + "\" y1=\"" + pad + "\" x2=\"" + lx.toFixed(1) + "\" y2=\"" + (H - pad - 10) + "\" stroke=\"var(--accent)\" stroke-opacity=\"0.4\" stroke-dasharray=\"2 2\"/>"; s += "<text x=\"" + (lx - 3).toFixed(1) + "\" y=\"" + (pad + 9) + "\" class=\"eqcurve-lbl\" text-anchor=\"end\" fill=\"var(--accent)\">LPF " + eq.lpf + " Hz</text>"; }
        GRIDF.forEach(function(f) { const x = fx(f); s += "<text x=\"" + x.toFixed(1) + "\" y=\"" + (H - 3) + "\" class=\"eqcurve-ax\" text-anchor=\"middle\">" + (f >= 1000 ? (f / 1000) + "k" : f) + " Hz</text>"; });
        s += "</svg>";
        let t = "<table class=\"panmap-vt\"><tr><th>Band</th><th>Freq</th><th>Setting</th></tr>";
        if (eq.hpf) t += "<tr><td class=\"nm\">Low cut</td><td>" + eq.hpf + " Hz</td><td>" + slope + " dB/oct</td></tr>";
        (eq.bands || []).forEach(function(b) { t += "<tr><td class=\"nm\">" + escapeHtml(b.label || (b.gain < 0 ? "Cut" : "Boost")) + "</td><td>" + b.f + " Hz</td><td>" + (b.gain > 0 ? "+" : "") + b.gain + " dB" + (b.q ? ", Q " + b.q : "") + "</td></tr>"; });
        if (eq.lpf) t += "<tr><td class=\"nm\">High cut</td><td>" + eq.lpf + " Hz</td><td>" + (eq.lpfSlope || slope) + " dB/oct</td></tr>";
        t += "</table>";
        const note = eq.note ? "<p class=\"panmap-note\">" + escapeHtml(eq.note) + "</p>" : "";
        return "<div class=\"panmap eqcurve\"><div class=\"panmap-label\">EQ curve</div>" + s + t + note + "</div>";
      }

      function renderChainSection(card) {
        let html = "";
        html += renderSignalFlowChips(card.signalFlow);
        html += renderRoutingBlock(card.routing);
        html += renderPanMap(card.panLayers);
        if (!card.chainSteps || !card.chainSteps.length) {
          return html + "<p class=\"detail-text\">No chain steps defined.</p>";
        }
        const anyOpen = card.chainSteps.some(function(s, i) { return !!state.chainStepsOpen[card.id + ":step:" + i]; });
        html += "<div class=\"csteps-wrap\">";
        html += "<div class=\"csteps-toolbar\">" +
          "<button type=\"button\" class=\"csteps-foldall\" data-cstep-foldall=\"" + escapeHtml(card.id) + "\">" +
          (anyOpen ? "Collapse all" : "Expand all") + "</button></div>";
        html += "<div class=\"csteps\">";
        card.chainSteps.forEach(function(step, idx) {
          html += renderChainStep(step, idx, card.id);
        });
        html += "</div>";
        html += "</div>";
        return html;
      }

      function renderImplementationSection(card, kind) {
        const titles = {
          "chain": "Chain",
          "capture": "Capture",
          "arrangement": "Arrangement",
          "routing": "Routing",
          "parallel-blend": "Parallel blend",
          "send-automation": "Send automation",
          "print-workflow": "Print workflow",
          "bus-glue": "Bus glue",
          "tracking-strategy": "Tracking strategy",
          "modulator-carrier": "Modulator + carrier",
          "midi-engine": "MIDI engine",
          "sound-design": "Sound design",
          "sampler": "Sampler",
          "reuse-existing-path": "Reuses existing path",
          "recipe": "Recipe"
        };
        const title = titles[kind] || kind;
        let body;
        if (kind === "chain") {
          body = renderChainSection(card);
        } else {
          // No dedicated renderer for this section kind; show a neutral label fallback.
          body = "<div class=\"impl-scaffold\">" + escapeHtml(title) + "</div>";
        }
        return "<div class=\"impl-section\"><h4 class=\"impl-section-title\">" + escapeHtml(title) + "</h4>" + body + "</div>";
      }

      function renderImplementationSections(card) {
        if (!card.implementationSections || !card.implementationSections.length) {
          return "<div class=\"impl-scaffold\">No implementation sections declared.</div>";
        }
        return card.implementationSections.map(function(kind) {
          return renderImplementationSection(card, kind);
        }).join("");
      }

      // ── Details column (third column) ─────────────────────────────

      function renderPluginCardInline(pluginId) {
        const card = PLUGIN_CARDS[pluginId];
        if (!card) return "<div class=\"details-empty\">Plugin reference missing.</div>";
        let html = "<div class=\"details-card\">";
        html += "<div class=\"details-card-label\"><span>Plugin reference</span><button type=\"button\" class=\"details-close\" data-details-close=\"1\">Close ✕</button></div>";
        html += "<div class=\"pc-head\">";
        html += "<div class=\"pc-name\">" + escapeHtml(card.name) + "</div>";
        html += "<div class=\"pc-vendor\">" + escapeHtml(card.vendor) + "</div>";
        if (card.roles && card.roles.length) {
          html += "<div class=\"pc-roles\">" + card.roles.map(function(r) { return "<span class=\"pc-role\">" + escapeHtml(r) + "</span>"; }).join("") + "</div>";
        }
        html += "</div>";
        if (card.whatItIs) html += "<div class=\"pc-section\"><h4>What it is</h4><p>" + escapeHtml(card.whatItIs) + "</p></div>";
        if (card.keyControls && card.keyControls.length) {
          html += "<div class=\"pc-section\"><h4>Key controls</h4><dl class=\"pc-controls\">";
          html += card.keyControls.map(function(kc) {
            return "<dt>" + escapeHtml(kc.control) + "</dt><dd>" + escapeHtml(kc.note) + "</dd>";
          }).join("");
          html += "</dl></div>";
        }
        if (card.whenToReachForIt && card.whenToReachForIt.length) {
          html += "<div class=\"pc-section\"><h4>When to reach for it</h4><ul>" +
            card.whenToReachForIt.map(function(w) { return "<li>" + escapeHtml(w) + "</li>"; }).join("") +
            "</ul></div>";
        }
        if (card.docsUrl) html += "<p class=\"pc-docs\"><a href=\"" + escapeHtml(card.docsUrl) + "\" target=\"_blank\" rel=\"noopener\">Vendor docs ↗</a></p>";
        html += "</div>";
        return html;
      }

      function renderLearnNodeInline(learnId) {
        const node = LEARN_INDEX[learnId];
        if (!node) return "<div class=\"details-empty\">Learn node not found: " + escapeHtml(learnId) + "</div>";
        let html = "<div class=\"details-card\">";
        html += "<div class=\"details-card-label\"><span>Learn · " + escapeHtml(learnId) + "</span><button type=\"button\" class=\"details-close\" data-details-close=\"1\">Close ✕</button></div>";
        html += "<h3 class=\"ln-title\">" + escapeHtml(node.title) + "</h3>";
        html += "<div class=\"ln-summary\">" + escapeHtml(node.in_session) + "</div>";
        html += "<p class=\"ln-body\">" + escapeHtml(node.body) + "</p>";
        if (node.synthesis_ref) html += "<div class=\"ln-meta\"><strong>synthesis_ref:</strong> " + escapeHtml(node.synthesis_ref) + "</div>";
        if (node.related && node.related.length) {
          html += "<div class=\"ln-meta ln-related\"><strong>related:</strong> " +
            node.related.map(function(id) { return "<a href=\"#\" data-why-learn-id=\"" + escapeHtml(id) + "\">" + escapeHtml(id) + "</a>"; }).join(" · ") +
            "</div>";

      function getDetailsPanelForCard(cardId) {
        return state.detailsByCard[cardId] || { kind: null, id: null };
      }

      function renderDetailsColumn() {
        const dp = getDetailsPanelForCard(state.selectedCardId);
        if (dp.kind === "plugin") return renderPluginCardInline(dp.id);
        if (dp.kind === "learn") return renderLearnNodeInline(dp.id);
        return "";  // No placeholder — empty column when nothing is pinned
      }

      function activeCardUsesNewSchema() {
        const card = CARD_INDEX[state.selectedCardId];
        return !!(card && Array.isArray(card.implementationSections) && card.implementationSections.length);
      }

      function refreshDetailsColumn() {
        const target = document.getElementById("details-column");
        if (target) target.innerHTML = renderDetailsColumn();
        updatePluginPillStates();
      }

      function setDetailsPanel(kind, id) {
        state.detailsByCard[state.selectedCardId] = { kind: kind, id: id };
        refreshDetailsColumn();
      }

      function closeDetailsPanel() {
        delete state.detailsByCard[state.selectedCardId];
        refreshDetailsColumn();
      }

      function updatePluginPillStates() {
        const dp = getDetailsPanelForCard(state.selectedCardId);
        const activeId = dp.kind === "plugin" ? dp.id : null;
        const pills = document.querySelectorAll("[data-plugin-id]");
        pills.forEach(function(p) {
          p.setAttribute("aria-expanded", p.getAttribute("data-plugin-id") === activeId ? "true" : "false");
        });
      }

      function renderPlacement(placement) {
        if (!placement) return "<p class=\"detail-text\">—</p>";
        const mode = placement.mode || "parallel";
        const defaultMode = mode === "either" ? (placement.defaultMode || "parallel") : mode;
        return "<div class=\"placement-block\"><dl>" +
          "<div class=\"placement-row\"><dt>Mode:</dt><dd>" + escapeHtml(mode) + (mode === "either" ? " (default: " + escapeHtml(defaultMode) + ")" : "") + "</dd></div>" +
          "<div class=\"placement-row\"><dt>Tap:</dt><dd>" + escapeHtml(placement.tap || "—") + "</dd></div>" +
          "<div class=\"placement-row\"><dt>Return:</dt><dd>" + escapeHtml(placement.return || "—") + "</dd></div>" +
          (placement.notes && placement.notes.length ? "<div class=\"placement-row\"><dt>Notes:</dt><dd>" + escapeHtml(placement.notes.join(" · ")) + "</dd></div>" : "") +
          "</dl></div>";
      }

      function renderCompatEntries(entries) {
        if (!entries || !entries.length) return "<p class=\"detail-text\">None</p>";
        return "<div class=\"compat-list\">" + entries.map(function(e) {
          const base = e.targetType === "category" ? ("category: " + e.target) : ("card: " + e.target);
          const ex = e.except && e.except.length ? " · except: " + e.except.join(", ") : "";
          return "<div class=\"compat-entry\">" + escapeHtml(base + ex + (e.notes ? " · " + e.notes : "")) + "</div>";
        }).join("") + "</div>";
      }

      function renderAvoidEntries(entries) {
        if (!entries || !entries.length) return "<p class=\"detail-text\">None</p>";
        return "<div class=\"compat-list\">" + entries.map(function(e) {
          const base = e.targetType === "category" ? ("category: " + e.target) : ("card: " + e.target);
          return "<div class=\"compat-entry\">" + escapeHtml(base + (e.reason ? " · " + e.reason : "")) + "</div>";
        }).join("") + "</div>";
      }

      // Synthesize a routing object from a modifier's placement so it renders in the
      // unified diagram: parallel = a duplicate blended back; insert = in series on the lead.
      function modifierRouting(card) {
        const p = card.placement || {};
        const mode = p.mode === "either" ? (p.defaultMode || "parallel") : p.mode;
        const name = card.title.replace(/\s+Modifier$/i, "");
        const noteParts = [];
        if (p.tap) noteParts.push("Tap: " + p.tap);
        if (p.return) noteParts.push("Return: " + p.return);
        if (p.notes && p.notes.length) noteParts.push(p.notes.join(" · "));
        const notes = noteParts.join(" · ") || null;
        if (mode === "parallel") {
          return {
            main: [ { node: "Lead", role: "source" }, { edge: "to" }, { node: "Vocal Bus", role: "bus" }, { edge: "to" }, { node: "Master", role: "master" } ],
            branches: [ { edge: "parallel", nodes: [ { node: name, role: "parallel" }, { edge: "return" }, { node: "Vocal Bus", role: "bus" } ] } ],
            notes: notes
          };
        }
        // insert / series
        return {
          main: [ { node: "Lead", role: "source" }, { edge: "insert" }, { node: name, role: "fx" }, { edge: "to" }, { node: "Vocal Bus", role: "bus" }, { edge: "to" }, { node: "Master", role: "master" } ],
          branches: [],
          notes: notes
        };
      }

      function renderModifierCard(card) {
        let html = "<div class=\"card-header\">";
        html += "<h2 class=\"card-title\">" + escapeHtml(card.title) + "</h2>";
        html += renderChipRow(card);
        html += "</div>";
        html += "<p class=\"card-what\">" + escapeHtml(card.what) + "</p>";
        html += renderDetailSection("When", renderDetailList(card.when, false));
        html += renderDetailSection("Apply", renderDetailList(card.apply, false));
        if (card.placement && card.placement.mode) html += renderDetailSection("Placement", renderRoutingBlock(modifierRouting(card)));
        else html += renderDetailSection("Placement", renderPlacement(card.placement));
        html += renderDetailSection("Compatible", renderCompatEntries(card.compatible));
        html += renderDetailSection("Avoid", renderAvoidEntries(card.avoid));
        html += renderDetailSection("Chain touchpoints", renderChainFlow(card.chainTouchpoints));
        html += renderDetailSection("Adapt if", renderDetailList(card.adaptIf, true));
        html += renderWhy2(card.why);
        return html;
      }

      function renderBusCard(card) {
        let html = "<div class=\"card-header\">";
        html += "<h2 class=\"card-title\">" + escapeHtml(card.title) + "</h2>";
        html += renderChipRow(card);
        html += "</div>";
        html += "<p class=\"card-what\">" + escapeHtml(card.what) + "</p>";
        html += renderDetailSection("When", renderDetailList(card.when, false));
        if (card.chainSteps && card.chainSteps.length) {
          // Structured form: routing diagram (inputs → bus → master) + the bus insert chain.
          html += renderChainSection(card);
        } else {
          html += renderDetailSection("Route", renderDetailList(card.route, false));
          html += renderDetailSection("Chain", renderChainFlow(card.chain));
        }
        html += renderDetailSection("Adapt if", renderDetailList(card.adaptIf, true));
        html += renderWhy2(card.why);
        return html;
      }

      // Composite component/recipe strings → clickable links to the cards they name.
      // Greedy longest-title-first, word-boundary, non-overlapping match against all layer cards.
      let _titleMatchers = null;
      function titleMatchers() {
        if (_titleMatchers) return _titleMatchers;
        _titleMatchers = LAYERS_CARDS
          .filter(function(c) { return c.title && c.title.length >= 4; })
          .map(function(c) { return { id: c.id, title: c.title }; })
          .sort(function(a, b) { return b.title.length - a.title.length; });
        return _titleMatchers;
      }
      function linkifyComponentText(text) {
        const lower = text.toLowerCase();
        const taken = new Array(text.length).fill(false);
        const matches = [];
        titleMatchers().forEach(function(m) {
          const t = m.title.toLowerCase();
          let from = 0, idx;
          while ((idx = lower.indexOf(t, from)) !== -1) {
            const end = idx + t.length;
            const before = idx === 0 || !/[a-z0-9]/i.test(text[idx - 1]);
            const after = end >= text.length || !/[a-z0-9]/i.test(text[end]);
            let free = before && after;
            if (free) { for (let i = idx; i < end; i++) { if (taken[i]) { free = false; break; } } }
            if (free) { matches.push({ idx: idx, end: end, id: m.id }); for (let i = idx; i < end; i++) taken[i] = true; }
            from = end;
          }
        });
        if (!matches.length) return escapeHtml(text);
        matches.sort(function(a, b) { return a.idx - b.idx; });
        let out = "", pos = 0;
        matches.forEach(function(mt) {
          out += escapeHtml(text.slice(pos, mt.idx));
          out += "<a href=\"#\" class=\"component-link\" data-select-card=\"" + escapeHtml(mt.id) + "\">" + escapeHtml(text.slice(mt.idx, mt.end)) + "</a>";
          pos = mt.end;
        });
        out += escapeHtml(text.slice(pos));
        return out;
      }
      function renderDetailListLinked(items) {
        if (!items || !items.length) return "<p class=\"detail-text\">—</p>";
        return "<ul class=\"detail-list\">" + items.map(function(t) { return "<li>" + linkifyComponentText(t) + "</li>"; }).join("") + "</ul>";
      }

      function displayCategory(c) {

      function renderAllLayersView() {
        const layers = LAYERS_CARDS.slice();

        const roles   = SECTION_ROLE_OPTIONS;

        const filtered = layers.filter(function(c) {
          const cat = displayCategory(c);
          if (af.categories.size && !af.categories.has(cat)) return false;
          if (af.intents.size && !(c.intent || []).some(function(i) { return af.intents.has(i); })) return false;
          // Section filter: section-agnostic cards (empty sectionRole — Lead/Thickeners/Harmony/Modifiers/Buses)
          // fit any section, so they stay eligible. Only section-tagged cards are filtered by it.
          if (af.sectionRoles.size) {
            const roles = c.sectionRole || [];
            if (roles.length && !roles.some(function(r) { return af.sectionRoles.has(r); })) return false;
          }
          return true;
        });

        function chipBtn(val, filterSet, attr, label) {
          const on = filterSet.has(val);

        let html = "<div class=\"al-view\">";

        html += "<div class=\"al-filters\">";

        html += "<div class=\"al-filter-row\"><span class=\"al-filter-label\">Section</span>";

        html += "<span class=\"al-count\">" + filtered.length + " / " + layers.length + "</span>";
        html += "</div>";
        html += "</div>";

        html += "<div class=\"al-grid\">";
        for (const card of filtered) {
          const cat = displayCategory(card);
          let stageChips;
          if (Array.isArray(card.signalFlow) && card.signalFlow.length) {
            stageChips = card.signalFlow.map(function(kind) {

            });
          } else {
            stageChips = (card.chain || []).map(function(step) {
              const stage = detectChainStage(step);

              return "<span class=\"al-chain-chip " + meta.cls + "\">" + meta.label + "</span>";
            });
          }
          const uniqueChips = stageChips.filter(function(v, i, a) { return a.indexOf(v) === i; });
          const cm = categoryMeta(cat);
          html += "<button type=\"button\" class=\"al-card cat-accented\" data-select-card=\"" + escapeHtml(card.id) + "\" style=\"--cat-c:" + cm.color + "\">";
          html += "<div class=\"al-cat-tag\"><span class=\"al-cat-icon\">" + cm.icon + "</span>" + escapeHtml(cat) + "</div>";
          html += "<div class=\"al-card-title\">" + escapeHtml(card.title) + "</div>";
          html += "<div class=\"al-card-meta\">";
          for (const i of (card.intent || [])) html += "<span class=\"chip chip-intent\" style=\"font-size:11px\">" + escapeHtml(toTitleCase(i)) + "</span>";
          for (const r of (card.sectionRole || [])) html += "<span class=\"chip chip-role\" style=\"font-size:11px\">" + escapeHtml(toTitleCase(r)) + "</span>";
          html += "</div>";
          html += "<p class=\"al-card-what\">" + escapeHtml(card.what.replace(/<[^>]+>/g, "")) + "</p>";
          html += "<div class=\"al-chain-chips\">" + uniqueChips.join("") + "</div>";
          html += "</button>";
        }
        html += "</div></div>";
        return html;
      }

      function renderCardDetail(card) {

      // ── MIXING renderers ────────────────────────────────────────────────
      function mixCardMatchesQuery(card, q) {
        q = (q || "").trim();
        if (!q) return true;
        const fixText = (card.fixes || []).map(function(f) { return (f.tool || "") + " " + (f.settings || "") + " " + (f.rationale || "") + " " + (f.adaptIf || ""); }).join(" ");
        const hay = (card.title + " " + card.symptom.join(" ") + " " + card.descriptors.join(" ") + " " + card.location.join(" ") + " " + (card.youMightHear || []).join(" ") + " " + (card.causes || []).join(" ") + " " + fixText).toLowerCase();
        return hay.indexOf(q) >= 0;
      }
      function renderMixCardList(cards) {
        if (!cards.length) return "<p class=\"mix-empty\">No matching cards.</p>";
        return "<div class=\"mix-cardlist\">" + cards.map(function(c) {
          const active = c.id === state.mix.cardId;
