            "<span class=\"mix-card-title\">" + escapeHtml(c.title) + "</span>" +
            "<span class=\"mix-card-sym\">" + escapeHtml(toTitleCase(c.symptom[0])) + "</span></button>";
        }).join("") + "</div>";
      }
      function renderMixSymptomDoor() {
        const q = state.mix.query.toLowerCase();
        const cards = MIXING_CARDS.filter(function(c) { return mixCardMatchesQuery(c, q); });
        return "<div class=\"mix-search\"><input type=\"search\" id=\"mix-search-input\" placeholder=\"Describe what you hear…\" value=\"" + escapeHtml(state.mix.query) + "\" autocomplete=\"off\"></div>" + renderMixCardList(cards);
      }
      function renderMixDescriptorDoor() {

        const present = MIX_DESCRIPTORS.filter(function(d) { return MIXING_CARDS.some(function(c) { return c.descriptors.indexOf(d) >= 0; }); });
        let html = "<div class=\"mix-chips\">" + present.map(function(d) {

      function renderMixLocationDoor() {
        const sel = state.mix.location;
        const present = function(loc) { return MIXING_CARDS.some(function(c) { return c.location.indexOf(loc) >= 0; }); };
        const btn = function(loc) { return "<button type=\"button\" class=\"mix-loc" + (loc === sel ? " active" : "") + (present(loc) ? "" : " empty") + "\" data-mix-location=\"" + escapeHtml(loc) + "\">" + escapeHtml(toTitleCase(loc)) + "</button>"; };
        let html = "<div class=\"mix-tree\">";
        html += "<div class=\"mix-tree-label\">Where in the spectrum?</div><div class=\"mix-tree-group\">" + MIX_LOC_SPECTRAL.filter(present).map(btn).join("") + "</div>";
        html += "<div class=\"mix-tree-label\">Or another axis</div><div class=\"mix-tree-group\">" + MIX_LOC_NONSPECTRAL.filter(present).map(btn).join("") + "</div>";
        html += "</div>";
        if (sel) {
          const cards = MIXING_CARDS.filter(function(c) { return c.location.indexOf(sel) >= 0; });
          const descs = MIX_DESCRIPTORS.filter(function(d) { return cards.some(function(c) { return c.descriptors.indexOf(d) >= 0; }); });
          if (descs.length) html += "<div class=\"mix-branch-descs\">" + descs.map(function(d) { return "<span class=\"mix-chip-static\">" + escapeHtml(toTitleCase(d)) + "</span>"; }).join("") + "</div>";
          html += renderMixCardList(cards);
        } else {
          html += "<p class=\"mix-hint\">Narrows to the symptoms that live in that band.</p>";

      }
      function renderMixDoorBody() {

        if (state.mix.mode === "location") return renderMixLocationDoor();

      function renderMixSidebar() {

        html += "</div><div class=\"mix-doorbody\" id=\"mix-doorbody\">" + renderMixDoorBody() + "</div></aside>";
        return html;
      }
      function renderMixDetail() {
        const card = state.mix.cardId ? MIX_INDEX[state.mix.cardId] : null;
        if (!card) return "<div class=\"empty-detail\">Pick a symptom, descriptor, or spectral location to find a fix.</div>";

      // ── RECORD renderers ────────────────────────────────────────────────
      function renderRecordSidebar() {

      }
      // To-scale capture diagram (head ~22cm > pop 13cm > mic), drawn from card.geom.
      // VAR 1 head: oval + nose + centered neck + open mouth. Distance range = faded band.
      function renderRecordDiagram(g) {
        if (!g || !Array.isArray(g.distanceCm)) return "";
        const S = 6, RAD = Math.PI / 180;
        const min = g.distanceCm[0], max = g.distanceCm[1], mid = Math.round((min + max) / 2);
        const pop = g.popOffsetCm, ang = g.angleDeg || 0;
        const ry = 11 * S, rx = 9 * S;
        const leftPad = 10, leftRel = Math.max(mid * S + 2 * rx, max * S);
        const micX = leftPad + leftRel, mouthX = micX - mid * S, cx = mouthX - rx;
        const xMin = micX - min * S, xMax = micX - max * S, xPop = micX - pop * S;
        const popH = 13 * S, my = Math.round(1.12 * ry + 46), micHalf = 2.5 * S, micH = 15 * S;
        const W = Math.round(micX + micHalf + 40), H = Math.round(my + 1.3 * ry + 34);
        let micLines = "";
        for (let i = -3; i <= 3; i++) micLines += "<line x1=\"" + (micX - micHalf + 4) + "\" y1=\"" + (my + i * 5) + "\" x2=\"" + (micX + micHalf - 4) + "\" y2=\"" + (my + i * 5) + "\" stroke=\"var(--rec-gold)\" stroke-width=\"1.2\"/>";
        const micIcon = "<g transform=\"rotate(" + (-ang) + " " + micX + " " + my + ")\"><rect x=\"" + (micX - micHalf) + "\" y=\"" + (my - micH / 2) + "\" width=\"" + (micHalf * 2) + "\" height=\"" + micH + "\" rx=\"" + micHalf + "\" fill=\"#23303a\" stroke=\"var(--rec-gold)\" stroke-width=\"2.2\"/>" + micLines + "<line x1=\"" + micX + "\" y1=\"" + (my + micH / 2) + "\" x2=\"" + micX + "\" y2=\"" + (my + micH / 2 + 18) + "\" stroke=\"var(--rec-gold)\" stroke-width=\"2.2\"/></g>";
        const distLabel = (min === max ? min : min + "–" + max) + " cm";
        const aw = Math.max(40, distLabel.length * 6.8), amid = (mouthX + micX) / 2, ay = my - 28;
        const distArrow = "<line x1=\"" + (mouthX + 2) + "\" y1=\"" + ay + "\" x2=\"" + (micX - 2) + "\" y2=\"" + ay + "\" stroke=\"var(--rec-arrow)\" stroke-width=\"1.8\"/>" +
          "<path d=\"M" + mouthX + " " + ay + " l9 -4.5 v9 z\" fill=\"var(--rec-arrow)\"/><path d=\"M" + micX + " " + ay + " l-9 -4.5 v9 z\" fill=\"var(--rec-arrow)\"/>" +
          "<rect x=\"" + (amid - aw / 2) + "\" y=\"" + (ay - 21) + "\" width=\"" + aw + "\" height=\"16\" rx=\"4\" fill=\"var(--panel)\" stroke=\"var(--rec-arrow)\" stroke-width=\"1\"/>" +
          "<text x=\"" + amid + "\" y=\"" + (ay - 9) + "\" text-anchor=\"middle\" fill=\"var(--rec-arrow)\" font-size=\"11\" font-family=\"ui-monospace,Menlo,monospace\" font-weight=\"700\">" + escapeHtml(distLabel) + "</text>";
        const band = (xMax !== xMin) ? "<rect x=\"" + xMax + "\" y=\"" + (my - 9) + "\" width=\"" + (xMin - xMax) + "\" height=\"18\" rx=\"3\" fill=\"rgba(94,200,224,.14)\" stroke=\"var(--rec-cyan)\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>" : "";
        const noseZ = 2.6 * S;
        const head = "<rect x=\"" + (cx - 3.2 * S) + "\" y=\"" + (my + ry * 0.62) + "\" width=\"" + (6.4 * S) + "\" height=\"" + (ry * 0.6) + "\" rx=\"6\" fill=\"var(--rec-sil)\"/>" +
          "<ellipse cx=\"" + cx + "\" cy=\"" + (my - ry * 0.12) + "\" rx=\"" + rx + "\" ry=\"" + ry + "\" fill=\"var(--rec-sil)\"/>" +
          "<path d=\"M" + (mouthX - 2) + " " + (my - 7 - noseZ) + " q" + (noseZ + 4) + " " + (noseZ * 0.55) + " 1 " + (noseZ * 1.25) + " z\" fill=\"var(--rec-sil)\"/>" +
          "<ellipse cx=\"" + (mouthX - 6) + "\" cy=\"" + my + "\" rx=\"6\" ry=\"8.5\" fill=\"var(--rec-mouth)\"/>";
        let off;
        if (ang > 0) {
          off = "<line x1=\"" + mouthX + "\" y1=\"" + my + "\" x2=\"" + micX + "\" y2=\"" + my + "\" stroke=\"#3b4654\" stroke-width=\"1\" stroke-dasharray=\"5 4\"/>" +
            "<line x1=\"" + micX + "\" y1=\"" + my + "\" x2=\"" + (micX - 48 * Math.cos(ang * RAD)) + "\" y2=\"" + (my - 48 * Math.sin(ang * RAD)) + "\" stroke=\"var(--rec-accent)\" stroke-width=\"1.6\"/>" +
            "<path d=\"M" + (micX - 40) + " " + my + " A40 40 0 0 0 " + (micX - 40 * Math.cos(ang * RAD)) + " " + (my - 40 * Math.sin(ang * RAD)) + "\" fill=\"none\" stroke=\"var(--rec-accent)\" stroke-width=\"1.5\"/>" +
            "<text x=\"" + (micX - 54) + "\" y=\"" + (my - 15) + "\" fill=\"var(--rec-accent)\" font-size=\"10.5\" font-family=\"ui-monospace,Menlo,monospace\">" + ang + "° off-axis</text>";
        } else {
          off = "<line x1=\"" + mouthX + "\" y1=\"" + my + "\" x2=\"" + micX + "\" y2=\"" + my + "\" stroke=\"var(--rec-accent)\" stroke-width=\"1.6\"/>" +
            "<text x=\"" + (micX - 50) + "\" y=\"" + (my - 12) + "\" fill=\"var(--rec-accent)\" font-size=\"10.5\" font-family=\"ui-monospace,Menlo,monospace\">on-axis</text>";
        }
        return "<div class=\"rec-diagram\"><svg viewBox=\"0 0 " + W + " " + H + "\" role=\"img\" aria-label=\"Capture distance diagram\">" +
          head + band + "<ellipse cx=\"" + xPop + "\" cy=\"" + my + "\" rx=\"5\" ry=\"" + (popH / 2) + "\" fill=\"rgba(240,164,111,.16)\" stroke=\"var(--rec-pop)\" stroke-width=\"1.8\"/>" +

      function collectInlineLearnIds(card) {
        const ids = [];
        function scan(value) {
          if (typeof value === "string") {
            const wrapper = document.createElement("div");
            wrapper.innerHTML = value;
            wrapper.querySelectorAll("[data-learn-link]").forEach((node) => ids.push(node.getAttribute("data-learn-link")));
            return;
          }
          if (Array.isArray(value)) { value.forEach(scan); return; }
          if (value && typeof value === "object") Object.keys(value).forEach((key) => scan(value[key]));
        }
        scan(card);
        return ids;
      }

      function extractProseText(card) {
        const parts = [];
        function push(v) {
          if (typeof v === "string") parts.push(v);
          else if (Array.isArray(v)) v.forEach(push);
        }
        push(card.what); push(card.when); push(card.apply); push(card.route); push(card.align); push(card.chain); push(card.adaptIf);
        push(card.components); push(card.markers); push(card.recipe);
        if (card.take) { push(card.take.capture); if (card.take.direction) { push(card.take.direction.focus); push(card.take.direction.prompt); } }
        if (card.evidence) { push(card.evidence.genreEvidence); push(card.evidence.observable); }
        if (card.variants) push(card.variants.map((v) => (v.name + " " + v.note)));
        if (card.chainSteps) {
          for (const step of card.chainSteps) {
            push(step.role); push(step.setLikeThis); push(step.mistake);
            if (step.defaults) push(step.defaults.map((d) => (d.control + " " + d.value + " " + (d.note || ""))));
            if (step.adapt) push(step.adapt.map((a) => (a.trait + " " + a.action)));
            if (step.alternatives) push(step.alternatives.map((a) => (a.pluginLabel + " " + a.characterNote)));
          }
        }
        // Displayed routing + diagram prose must also be oracle-checked.
        if (card.routing) {
          push(card.routing.notes);
          if (card.routing.converge) push(card.routing.converge.notes);
        }
        if (card.eqCurve) {
          push(card.eqCurve.note);
          if (card.eqCurve.bands) push(card.eqCurve.bands.map((b) => b.label || ""));
        }
        return parts.join(" ");
      }

      function verifyModifierFixtureCases(errors) {
        const fixtureCard = { id: "fixture.card", subtype: "layer_recipe", layerCategory: "Lead" };
        const explicitMod = { compatible: [{ targetType: "card", target: "fixture.card", notes: "explicit card" }], avoid: [], placement: { mode: "parallel", tap: "x", return: "y" } };
        const defaultMod = { compatible: [], avoid: [], placement: { mode: "parallel", tap: "x", return: "y" } };
        const avoidMod = { compatible: [], avoid: [{ targetType: "card", target: "fixture.card", reason: "avoid test" }], placement: { mode: "parallel" } };
        const exceptMod = { compatible: [{ targetType: "category", target: "Lead", except: ["fixture.card"], notes: "category test" }], avoid: [], placement: { mode: "parallel" } };
        const placementMod = { compatible: [{ targetType: "card", target: "fixture.card", placementOverride: { mode: "parallel", return: "-7 dB" }, notes: "placement override test" }], avoid: [], placement: { mode: "parallel", return: "-12 dB" } };

        const r1 = resolveModifierState(explicitMod, fixtureCard);
        const r2 = resolveModifierState(defaultMod, fixtureCard);
        const r3 = resolveModifierState(avoidMod, fixtureCard);
        const r4 = resolveModifierState(exceptMod, fixtureCard);
        const r5 = resolveModifierState(placementMod, fixtureCard);

        if (r1.state !== "explicit") errors.push("Modifier fixture explicit-compatible failed.");
        if (r2.state !== "default") errors.push("Modifier fixture default-compatible failed.");
        if (r3.state !== "avoid") errors.push("Modifier fixture avoid failed.");
        if (r4.state !== "avoid" || r4.source !== "except-avoid") errors.push("Modifier fixture except-override failed.");
        if (r5.state !== "explicit" || !r5.placement || r5.placement.return !== "-7 dB") errors.push("Modifier fixture placement-override failed.");
      }

      function runIntegrityValidator() {
        const errors = [];
        const forbidden = [/\bbest\b/i, /\bshould\b/i, /\bmust\b/i, /\bright answer\b/i, /\bcorrect\b/i, /\bmandatory\b/i, /\bnot optional\b/i];
        const categorySet = new Set(LAYER_CATEGORIES);
        const cardIdSet = new Set(LAYERS_CARDS.map((card) => card.id));

        for (const duplicateId of learnBuild.collisions) errors.push("learnId collision: " + duplicateId);
        for (const node of LEARN_NODES) {
          if (!node.in_session || !node.in_session.trim()) errors.push("LEARN node missing in_session: " + node.learnId);
          for (const relId of node.related || []) if (!LEARN_INDEX[relId]) errors.push("Missing LEARN related learnId '" + relId + "' in node '" + node.learnId + "'");
          const learnText = [node.title, node.in_session, node.body].join(" ");
          for (const pattern of forbidden) {
            if (pattern.test(learnText)) errors.push("Forbidden oracle term '" + pattern + "' in LEARN node '" + node.learnId + "'");
          }
        }

        const modifiers = LAYERS_CARDS.filter((card) => card.subtype === "modifier");
        const layerRecipes = LAYERS_CARDS.filter((card) => card.subtype === "layer_recipe");

        for (const card of LAYERS_CARDS) {
          if (!card.evidence || (!(card.evidence.genreEvidence || []).length && !(card.evidence.observable || []).length)) {
            errors.push("Card missing evidence: " + card.id);
          }
          for (const learnId of card.why || []) if (!LEARN_INDEX[learnId]) errors.push("Missing WHY learnId '" + learnId + "' in card '" + card.id + "'");
          for (const link of card.links || []) if (link.type === "learn" && !LEARN_INDEX[link.learnId]) errors.push("Missing LINKS learnId '" + link.learnId + "' in card '" + card.id + "'");
          for (const learnId of collectInlineLearnIds(card)) if (!LEARN_INDEX[learnId]) errors.push("Missing inline glossary learnId '" + learnId + "' in card '" + card.id + "'");
          const proseText = extractProseText(card);
          for (const pattern of forbidden) if (pattern.test(proseText)) errors.push("Forbidden oracle term '" + pattern + "' in card '" + card.id + "'");
        }

        for (const card of layerRecipes) {
          if (Object.prototype.hasOwnProperty.call(card, "modifierRefs") || Object.prototype.hasOwnProperty.call(card, "modifier")) {
            errors.push("layer_recipe carries authored modifier field: " + card.id);
          }
          if (card.evidence && card.evidence.genreEvidence && card.evidence.genreEvidence.length) {
            const supporting = (card.why || []).some((id) => LEARN_INDEX[id] && LEARN_INDEX[id].synthesis_ref);
            if (!supporting) errors.push("GENRE_EVIDENCE missing WHY/synthesis_ref backing: " + card.id);
          }
        }

        for (const modifier of modifiers) {
          const placement = modifier.placement || {};
          if (placement.mode === "either" && !placement.defaultMode) errors.push("Modifier mode=either missing default_mode: " + modifier.id);
          for (const entry of modifier.compatible || []) {
            if (entry.targetType === "category" && !categorySet.has(entry.target)) errors.push("Modifier compatible category not found: " + modifier.id + " -> " + entry.target);
            if (entry.targetType === "card" && !cardIdSet.has(entry.target)) errors.push("Modifier compatible card not found: " + modifier.id + " -> " + entry.target);
            for (const ex of entry.except || []) if (!cardIdSet.has(ex)) errors.push("Modifier compatible EXCEPT card missing: " + modifier.id + " -> " + ex);
          }
          for (const entry of modifier.avoid || []) {
            if (entry.targetType === "category" && !categorySet.has(entry.target)) errors.push("Modifier avoid category not found: " + modifier.id + " -> " + entry.target);
            if (entry.targetType === "card" && !cardIdSet.has(entry.target)) errors.push("Modifier avoid card not found: " + modifier.id + " -> " + entry.target);
          }
        }

        for (const cardId of HOUSE_TERM_CARD_IDS) {
          const card = CARD_INDEX[cardId];
          if (!card) errors.push("House-term card id missing: " + cardId);
          else if (!card.synonyms || !card.synonyms.length) errors.push("House-term card missing SYNONYMS: " + card.id);
        }

        const vocalStack = CARD_INDEX["layer.harmony.vocal-stack"];
        if (vocalStack && vocalStack.variants) {
          for (const variant of vocalStack.variants) {
            if (/(voicing|bus treatment|bus)/i.test(variant.note)) errors.push("Vocal Stack VARIANTS note drifts beyond layer-count guardrail: " + variant.name);
          }
        }

        verifyModifierFixtureCases(errors);

        // PLUGIN_CARDS link integrity for cards using the v0.2.5 structured chain.
        // pluginId is OPTIONAL — pluginless steps (placement / level / automation / capture /
        // arrangement) carry no plugin. Validate the id only when present.
        const BASIS_VALUES = new Set(["legacy", "official_doc", "engineer_interview", "publication", "operator_default", "interpretation", "research"]);
        for (const card of LAYERS_CARDS) {
          if (!card.chainSteps) continue;
          card.chainSteps.forEach(function(step, idx) {
            if (step.pluginId && !PLUGIN_CARDS[step.pluginId]) {
              errors.push("chainStep pluginId not in PLUGIN_CARDS: " + card.id + " -> " + step.pluginId);
            }
            (step.defaults || []).forEach(function(dv) {
              if (dv.basis && !BASIS_VALUES.has(dv.basis)) {
                errors.push("Unknown DefaultValue basis '" + dv.basis + "' in card '" + card.id + "' step " + (idx + 1) + " (" + dv.control + ")");
              }
            });
          });
        }

        // ── Routing + chain-schema lint (B3): catch typos before they silently fall back ──
        const ROUTE_EDGE_KINDS = new Set(Object.keys(ROUTE_ICONS));
        const NODE_ROLES = new Set(["source", "bus", "fx", "parallel", "sidechain", "master", "default"]);
        const PLACEMENT_VALUES = new Set(["insert", "send", "sidechain", "parallel", "return"]);
        const STAGE_KINDS = new Set(Object.keys(STAGE_META));
        const SECTION_KINDS = new Set(["capture", "arrangement", "routing", "chain", "parallel-blend", "send-automation", "print-workflow", "bus-glue", "tracking-strategy", "modulator-carrier", "midi-engine", "sound-design", "sampler", "reuse-existing-path", "recipe"]);
        const SECTION_ROLE_SET = new Set(SECTION_ROLE_OPTIONS);
        const SECTION_REQUIRED_CATS = new Set(["Texture", "Accents", "Creative FX", "Composite"]);

        function lintRouteSeq(seq, cardId, where) {
          (seq || []).forEach(function(it) {
            if (it && it.node !== undefined) {
              const role = it.role || "default";
              if (!NODE_ROLES.has(role)) errors.push("Unknown routing node role '" + role + "' in card '" + cardId + "' (" + where + ")");
            } else if (it && it.edge !== undefined) {
              if (!ROUTE_EDGE_KINDS.has(it.edge)) errors.push("Unknown routing edge '" + it.edge + "' in card '" + cardId + "' (" + where + ")");
            } else {
              errors.push("Routing item is neither node nor edge in card '" + cardId + "' (" + where + ")");
            }
          });
        }

        for (const card of LAYERS_CARDS) {
          if (Array.isArray(card.implementationSections)) {
            for (const sec of card.implementationSections) {
              if (!SECTION_KINDS.has(sec)) errors.push("Unknown implementationSection '" + sec + "' in card '" + card.id + "'");
            }
            if (card.implementationSections.indexOf("chain") >= 0 && (!Array.isArray(card.chainSteps) || !card.chainSteps.length)) {
              errors.push("Card declares 'chain' section but has no chainSteps: " + card.id);
            }
          }
          for (const kind of card.signalFlow || []) {
            if (!STAGE_KINDS.has(kind)) errors.push("Unknown signalFlow stage '" + kind + "' in card '" + card.id + "'");
          }
          (card.chainSteps || []).forEach(function(step, idx) {
            if (step.stage && !STAGE_KINDS.has(step.stage)) errors.push("Unknown chainStep stage '" + step.stage + "' in card '" + card.id + "' step " + (idx + 1));
            if (step.placement && !PLACEMENT_VALUES.has(step.placement)) errors.push("Unknown chainStep placement '" + step.placement + "' in card '" + card.id + "' step " + (idx + 1));
          });
          const routing = card.routing;
          if (routing && routing.converge) {
            const cv = routing.converge;
            if (!Array.isArray(cv.sources) || !cv.sources.length) errors.push("routing.converge.sources missing/empty in card '" + card.id + "'");
            if (!cv.bus) errors.push("routing.converge.bus missing in card '" + card.id + "'");
            if (cv.tail !== undefined && !Array.isArray(cv.tail)) errors.push("routing.converge.tail present but not an array in card '" + card.id + "'");
            if (cv.duck && !cv.duck.key) errors.push("routing.converge.duck present but missing 'key' in card '" + card.id + "'");
            if (cv.duck && cv.duck.on !== undefined && cv.duck.on !== "bus" && cv.duck.on !== "source") errors.push("routing.converge.duck.on must be 'bus' or 'source' in card '" + card.id + "'");
          }
          if (routing && routing.main !== undefined && !Array.isArray(routing.main)) {
            errors.push("routing.main present but not an array in card '" + card.id + "'");
          }
          if (routing && Array.isArray(routing.main)) {
            lintRouteSeq(routing.main, card.id, "main");
            if (routing.branches !== undefined && !Array.isArray(routing.branches)) {
              errors.push("routing.branches present but not an array in card '" + card.id + "'");
            }
            (Array.isArray(routing.branches) ? routing.branches : []).forEach(function(b, i) {
              if (!b.edge || !ROUTE_EDGE_KINDS.has(b.edge)) errors.push("Branch " + (i + 1) + " missing/unknown edge in card '" + card.id + "'");
              if (!Array.isArray(b.nodes)) errors.push("Branch " + (i + 1) + " missing nodes array in card '" + card.id + "'");
              lintRouteSeq(b.nodes, card.id, "branch " + (i + 1));
            });
            if (routing.sidechains !== undefined && !Array.isArray(routing.sidechains)) {
              errors.push("routing.sidechains present but not an array in card '" + card.id + "'");
            }
            (Array.isArray(routing.sidechains) ? routing.sidechains : []).forEach(function(s, i) {
              if (!s.key) errors.push("Sidechain " + (i + 1) + " missing 'key' (source) in card '" + card.id + "'");
              if (!s.target) errors.push("Sidechain " + (i + 1) + " missing 'target' (ducked node) in card '" + card.id + "'");
            });
          }
          // Section-role rules (from the v0.2.5 audit): section-bearing categories MUST carry a sectionRole;
          // every declared role must be a known section.
          const cat = displayCategory(card);
          if (SECTION_REQUIRED_CATS.has(cat) && (!Array.isArray(card.sectionRole) || !card.sectionRole.length)) {
            errors.push("Section-bearing card missing sectionRole: " + card.id + " (" + cat + ")");
          }
          for (const role of card.sectionRole || []) {
            if (!SECTION_ROLE_SET.has(role)) errors.push("Unknown sectionRole '" + role + "' in card '" + card.id + "'");
          }
        }

        // ── MIXING card lint: every card reachable via all three doors ──
        const MIX_DESC_SET = new Set(MIX_DESCRIPTORS);
        const MIX_LOC_SET = new Set(MIX_LOCATIONS);
        const mixIds = new Set();
        for (const c of MIXING_CARDS) {
          if (!c.id || mixIds.has(c.id)) errors.push("MIXING card missing/duplicate id: " + (c.id || "(none)"));
          mixIds.add(c.id);
          if (!Array.isArray(c.symptom) || !c.symptom.length) errors.push("MIXING card missing symptom: " + c.id);
          if (!Array.isArray(c.descriptors) || !c.descriptors.length) errors.push("MIXING card missing descriptors: " + c.id);
          for (const d of c.descriptors || []) if (!MIX_DESC_SET.has(d)) errors.push("Unknown MIXING descriptor '" + d + "' in card '" + c.id + "'");
          if (!Array.isArray(c.location) || !c.location.length) errors.push("MIXING card missing location: " + c.id);
          for (const l of c.location || []) if (!MIX_LOC_SET.has(l)) errors.push("Unknown MIXING location '" + l + "' in card '" + c.id + "'");
          if (!Array.isArray(c.fixes) || !c.fixes.length) errors.push("MIXING card missing fixes: " + c.id);
          for (const f of c.fixes || []) {
            if (!f.settings) errors.push("MIXING fix missing settings in card '" + c.id + "'");
            if (f.pluginId && !PLUGIN_CARDS[f.pluginId]) errors.push("MIXING fix pluginId not in PLUGIN_CARDS: " + c.id + " -> " + f.pluginId);
          }
          for (const learnId of c.why || []) if (!LEARN_INDEX[learnId]) errors.push("Missing MIXING WHY learnId '" + learnId + "' in card '" + c.id + "'");
          const mixProse = [].concat(c.symptom || [], c.youMightHear || [], c.causes || [], (c.fixes || []).map(function(f) { return f.tool + " " + f.settings + " " + (f.rationale || "") + " " + (f.adaptIf || ""); })).join(" ");
          for (const pattern of forbidden) if (pattern.test(mixProse)) errors.push("Forbidden oracle term '" + pattern + "' in MIXING card '" + c.id + "'");
        }

        // ── SCREAM lint: phases/milestones well-formed, why resolves, no oracle terms ──
        const scrIds = new Set();
        for (const p of SCREAM_PHASES) {
          if (!Array.isArray(p.milestones) || !p.milestones.length) errors.push("SCREAM phase missing milestones: " + p.id);
          for (const m of p.milestones || []) {
            if (!m.id || scrIds.has(m.id)) errors.push("SCREAM milestone missing/duplicate id: " + (m.id || "(none)"));
            scrIds.add(m.id);
            if (!m.focus || !m.drill || !m.success) errors.push("SCREAM milestone missing focus/drill/success: " + m.id);
            if (m.video && (!m.video.id || !m.video.title)) errors.push("SCREAM milestone video missing id/title: " + m.id);
            for (const learnId of m.why || []) if (!LEARN_INDEX[learnId]) errors.push("Missing SCREAM WHY learnId '" + learnId + "' in milestone '" + m.id + "'");
            const scrProse = [m.focus, m.drill, m.success, m.safety || ""].join(" ");
            for (const pattern of forbidden) if (pattern.test(scrProse)) errors.push("Forbidden oracle term '" + pattern + "' in SCREAM milestone '" + m.id + "'");
          }
        }
        for (const learnId of (SCREAM_WARMUP.why || [])) if (!LEARN_INDEX[learnId]) errors.push("Missing SCREAM warmup WHY learnId '" + learnId + "'");
        if (typeof screamCheckGuidance !== "function") errors.push("SCREAM vocal-day check guidance function missing");

        // ── RECORD card lint: schema, direction enum, evidence + genre backing, why, oracle terms ──
        const DIR_VAR_SET = new Set(DIRECTION_VARIABLES);
        const recIds = new Set();
        for (const c of RECORD_CARDS) {
          if (!c.id || recIds.has(c.id)) errors.push("RECORD card missing/duplicate id: " + (c.id || "(none)"));
          recIds.add(c.id);
          if (!c.character || !c.what) errors.push("RECORD card missing character/what: " + c.id);
          if (!c.mic || !c.mic.type) errors.push("RECORD card missing mic.type: " + c.id);
          const p = c.placement || {};
          if (!p.distance || !p.angle || !p.polarPattern || !p.popFilter) errors.push("RECORD card missing a placement field: " + c.id);
          if (!c.gain) errors.push("RECORD card missing gain: " + c.id);
          if (!c.cueMix) errors.push("RECORD card missing cueMix: " + c.id);
          if (!Array.isArray(c.checklist) || !c.checklist.length) errors.push("RECORD card missing checklist: " + c.id);
          if (!c.direction || !DIR_VAR_SET.has(c.direction.variable)) errors.push("RECORD direction.variable not in enum: " + c.id + " -> " + (c.direction && c.direction.variable));
          if (c.geom) {
            const gd = c.geom.distanceCm;
            if (!Array.isArray(gd) || gd.length !== 2 || !(gd[0] > 0) || !(gd[1] >= gd[0])) errors.push("RECORD geom.distanceCm must be [min,max] with 0<min<=max: " + c.id);
            if (!(c.geom.popOffsetCm > 0)) errors.push("RECORD geom.popOffsetCm must be > 0: " + c.id);
            if (typeof c.geom.angleDeg !== "number" || c.geom.angleDeg < 0 || c.geom.angleDeg > 90) errors.push("RECORD geom.angleDeg must be 0-90: " + c.id);
            if (Array.isArray(gd) && c.geom.popOffsetCm >= gd[0]) errors.push("RECORD geom: popOffsetCm must be < min distance: " + c.id);
          }
          if (!c.evidence || (!(c.evidence.genreEvidence || []).length && !(c.evidence.observable || []).length)) errors.push("RECORD card missing evidence: " + c.id);
          if (c.evidence && (c.evidence.genreEvidence || []).length) {
            const supporting = (c.why || []).some((id) => LEARN_INDEX[id] && LEARN_INDEX[id].synthesis_ref);
            if (!supporting) errors.push("RECORD GENRE_EVIDENCE missing WHY/synthesis_ref backing: " + c.id);
          }
          for (const learnId of c.why || []) if (!LEARN_INDEX[learnId]) errors.push("Missing RECORD WHY learnId '" + learnId + "' in card '" + c.id + "'");
          const recProse = [c.title, c.what, c.mic && c.mic.note, p.distance, p.angle, p.polarPattern, p.popFilter, c.gain, c.cueMix]
            .concat(c.checklist || [], c.direction ? [c.direction.focus, c.direction.prompt] : [], [c.safety || ""]).join(" ");
          for (const pattern of forbidden) if (pattern.test(recProse)) errors.push("Forbidden oracle term '" + pattern + "' in RECORD card '" + c.id + "'");
        }
        // LAYERS ↔ RECORD wiring: recordRef resolves; take.direction.variable (where present) is in enum.
        for (const card of LAYERS_CARDS) {
          const t = card.take;
          if (t && t.recordRef && !RECORD_INDEX[t.recordRef]) errors.push("LAYERS take.recordRef not in RECORD_INDEX: " + card.id + " -> " + t.recordRef);
          if (t && t.direction && t.direction.variable && !DIR_VAR_SET.has(t.direction.variable)) errors.push("LAYERS take.direction.variable not in enum: " + card.id + " -> " + t.direction.variable);
        }

        if (errors.length) errors.forEach((msg) => console.error("[integrity]", msg));
        else console.info("[integrity] OK");
      }

      function render() {
        renderTabs();
        document.getElementById("app-main").innerHTML = renderMain();
        applyInlineLearnTooltips();

        persistMix();
        const main = document.getElementById("app-main");

        applyInlineLearnTooltips();

        persistScream();

        // then nudge the active milestone into view only if it scrolled out of sight.

      }

        const mixDesc = event.target.closest("[data-mix-descriptor]");
        if (mixDesc) { event.preventDefault(); const v = mixDesc.getAttribute("data-mix-descriptor"); state.mix.descriptor = (state.mix.descriptor === v ? null : v); refreshMixing(); return; }
        const mixLoc = event.target.closest("[data-mix-location]");
        if (mixLoc) { event.preventDefault(); const v = mixLoc.getAttribute("data-mix-location"); state.mix.location = (state.mix.location === v ? null : v); refreshMixing(); return; }
        const mixCard = event.target.closest("[data-mix-card]");
        if (mixCard) { event.preventDefault(); state.mix.cardId = mixCard.getAttribute("data-mix-card"); refreshMixing(); return; }
        const recordCard = event.target.closest("[data-record-card]");
        if (recordCard) { event.preventDefault(); selectRecord(recordCard.getAttribute("data-record-card")); return; }
        const recordLink = event.target.closest("[data-record-link]");
        if (recordLink) {
          event.preventDefault();
          const rid = recordLink.getAttribute("data-record-link");
          if (!RECORD_INDEX[rid]) return;
          state.activeTab = "record";
          state.record.cardId = rid;
          writeLastTab("record");

        const scrMs = event.target.closest("[data-scream-ms]");
        if (scrMs) { event.preventDefault(); state.scream.milestoneId = scrMs.getAttribute("data-scream-ms"); if (state.scream.mode !== "roadmap") state.scream.mode = "roadmap"; refreshScream(); return; }
        const scrUnlock = event.target.closest("[data-scream-unlock]");
        if (scrUnlock) {
          event.preventDefault();
          const id = scrUnlock.getAttribute("data-scream-unlock");
          toggleScreamUnlocked(id);

          refreshScream();

        }
        const scrCheck = event.target.closest("[data-scream-check]");
        if (scrCheck) { event.preventDefault(); const f = scrCheck.getAttribute("data-scream-check"); const v = scrCheck.getAttribute("data-scream-val"); state.scream.check[f] = (state.scream.check[f] === v ? null : v); const main = document.getElementById("app-main"); if (main) { main.innerHTML = renderMain(); applyInlineLearnTooltips(); } return; }
        const learnLink = event.target.closest("[data-why-learn-id], [data-learn-link]");
        if (learnLink) {

          if (!LEARN_INDEX[learnId]) { openTab("learn", true); return; }
          // If we're on a v0.2.5 layer card, surface the learn node in the Details column

          const detail = document.querySelector(".layers-detail");
          if (detail) { detail.innerHTML = renderAllLayersView(); detail.scrollTop = 0; }

        const modToggle = event.target.closest("[data-mod-toggle]");

            const body = wrap.querySelector("[data-cstep-body=\"" + key.replace(/"/g, '\\"') + "\"]");

          foldAllBtn.textContent = target ? "Collapse all" : "Expand all";

          const open = !!state.chainStepsOpen[key];
          const body = document.querySelector("[data-cstep-body=\"" + key.replace(/"/g, '\\"') + "\"]");
          const arrow = cstepBtn.querySelector(".cstep-arrow");

          if (arrow) arrow.classList.toggle("open", open);

            foldBtn.textContent = anyOpen ? "Collapse all" : "Expand all";

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && getDetailsPanelForCard(state.selectedCardId).kind) { closeDetailsPanel(); return; }

        // Don't hijack typing in inputs / editable fields, or modified key combos.
        const t = event.target;
        const inEditable = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
        if (event.metaKey || event.ctrlKey || event.altKey) return;

        // Left/Right arrows switch tabs (wraps around).
        if ((event.key === "ArrowLeft" || event.key === "ArrowRight") && !inEditable) {
          const tabIds = TAB_DEFS.map(function (tb) { return tb.id; });
          const cur = tabIds.indexOf(state.activeTab);
          if (cur === -1) return;
          const step = event.key === "ArrowRight" ? 1 : -1;
          event.preventDefault();
          openTab(tabIds[(cur + step + tabIds.length) % tabIds.length], true);
          return;
        }

        if (event.key !== "ArrowUp" && event.key !== "ArrowDown") return;
        if (inEditable) return;
        const dir = event.key === "ArrowDown" ? 1 : -1;

        if (state.activeTab === "layers") {
          const sidebar = document.getElementById("layers-sidebar");
          if (!sidebar) return;
          const links = Array.from(sidebar.querySelectorAll("[data-select-card]"));
          if (!links.length) return;
          const ids = links.map(function (el) { return el.getAttribute("data-select-card"); });
          let idx = ids.indexOf(state.selectedCardId);
          if (idx === -1) idx = dir === 1 ? -1 : links.length; // start at edge
          const next = idx + dir;
          if (next < 0 || next >= ids.length) return;
          event.preventDefault();
          selectCard(ids[next]);
          return;
        }

        if (state.activeTab === "mixing") {
          const body = document.getElementById("mix-doorbody");
          if (!body) return;
          const links = Array.from(body.querySelectorAll("[data-mix-card]"));
          if (!links.length) return;
          const ids = links.map(function (el) { return el.getAttribute("data-mix-card"); });
          let idx = ids.indexOf(state.mix.cardId);
          if (idx === -1) idx = dir === 1 ? -1 : links.length;
          const next = idx + dir;
          if (next < 0 || next >= ids.length) return;
          event.preventDefault();
          state.mix.cardId = ids[next];
          refreshMixing();
          return;
        }

        if (state.activeTab === "record") {
          const sidebar = document.getElementById("record-sidebar");
          if (!sidebar) return;
          const links = Array.from(sidebar.querySelectorAll("[data-record-card]"));
          if (!links.length) return;
          const ids = links.map(function (el) { return el.getAttribute("data-record-card"); });
          let idx = ids.indexOf(state.record.cardId);
          if (idx === -1) idx = dir === 1 ? -1 : links.length;
          const next = idx + dir;
          if (next < 0 || next >= ids.length) return;
          event.preventDefault();
          selectRecord(ids[next]);
          return;
        }

        if (state.activeTab === "scream") {
          // Unified sidebar order: the two session tools, then every milestone.
          const items = [{ kind: "mode", value: "check" }, { kind: "mode", value: "warmup" }]
            .concat(SCREAM_MILESTONES.map(function (m) { return { kind: "ms", value: m.id }; }));
          let idx;
          if (state.scream.mode === "check") idx = 0;
          else if (state.scream.mode === "warmup") idx = 1;
          else idx = items.findIndex(function (it) { return it.kind === "ms" && it.value === state.scream.milestoneId; });
          if (idx === -1) idx = dir === 1 ? -1 : items.length;
          const next = idx + dir;
          if (next < 0 || next >= items.length) return;
          event.preventDefault();
          const target = items[next];
          if (target.kind === "mode") {
            state.scream.mode = target.value;
          } else {
            state.scream.mode = "roadmap";
            state.scream.milestoneId = target.value;
          }
          refreshScream();
          return;
        }

        if (state.activeTab === "learn") {
          if (!LEARN_NODES.length) return;
          let idx = state.activeLearnId
            ? LEARN_NODES.findIndex(function (n) { return n.learnId === state.activeLearnId; })
            : (dir === 1 ? -1 : LEARN_NODES.length);
          const next = idx + dir;
          if (next < 0 || next >= LEARN_NODES.length) return;
          event.preventDefault();
          openLearn(LEARN_NODES[next].learnId, true);
        }
      });

      document.addEventListener("input", function (event) {
        if (event.target && event.target.id === "sb-search-input") {
          state.sbQuery = event.target.value;
          const sidebar = document.getElementById("layers-sidebar");
          if (sidebar) {
            sidebar.innerHTML = renderLayersSidebarInner();
            const inp = document.getElementById("sb-search-input");
            if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
          }
        } else if (event.target && event.target.id === "mix-search-input") {
          state.mix.query = event.target.value;
          persistMix();
          const body = document.getElementById("mix-doorbody");
          if (body) {
            body.innerHTML = renderMixDoorBody();
            const inp = document.getElementById("mix-search-input");
            if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
          }
        }
      });

      window.addEventListener("popstate", function () { activateFromLocation(false); });
      restoreMix();
      restoreScream();
      activateFromLocation(true);
      runIntegrityValidator();
    }());
  </script>
</body>
</html>
